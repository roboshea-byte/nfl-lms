<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#132650">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NFL LMS">
<title>NFL Last Man Standing</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#132650; --navy-2:#1b3266; --navy-3:#24427f; --line:#3a5a9c; --deep:#10204a;
  --red:#e8102e; --red-2:#ff4d5e; --gold:#ffc733; --green:#2fd97e; --grey:#aebbdc; --white:#ffffff;
  --field:#0f5c2e;
  --font-head:'Oswald', 'Arial Narrow', Impact, sans-serif; --font-body:'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--navy);color:var(--white);font-family:var(--font-body);font-size:14px;min-height:100%}
body{background:
  radial-gradient(1200px 500px at 50% -200px, #2f5cb8 0%, transparent 70%),
  repeating-linear-gradient(90deg, transparent 0 79px, rgba(255,255,255,.035) 79px 80px),
  var(--navy)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--gold)}
h1,h2,h3,h4{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.03em;margin:0}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1a3068 0%,#132650 100%);border-bottom:3px solid var(--red);box-shadow:0 6px 24px rgba(0,0,0,.45)}
.hdr-top{display:flex;align-items:center;gap:18px;padding:12px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand .shield{width:46px;height:52px;background:linear-gradient(180deg,var(--red),#8a0000);clip-path:polygon(0 0,100% 0,100% 65%,50% 100%,0 65%);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.brand h1{font-size:30px;font-weight:700;line-height:1}
.brand h1 small{display:block;font-size:12px;letter-spacing:.35em;color:var(--gold);font-weight:500}
.hdr-stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.stat{background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:6px 14px;min-width:96px;text-align:center}
.stat .v{font-family:var(--font-head);font-size:24px;font-weight:700;line-height:1.05}
.stat .l{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey)}
.stat.pub{cursor:pointer;border-color:var(--gold);background:rgba(255,199,51,.12)}
.stat.pub .v{color:var(--gold);font-size:16px;padding-top:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,199,51,.5)}50%{box-shadow:0 0 0 6px rgba(255,199,51,0)}}
.stat.pub.dirty{animation:pulse 1.6s infinite}
.stat.pot .v{color:var(--gold)}
.stat.alive .v{color:var(--green)}
nav{display:flex;gap:2px;padding:0 22px;overflow-x:auto;background:var(--deep)}
nav button{background:transparent;border:0;color:var(--grey);padding:12px 18px;font-family:var(--font-head);font-size:15px;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
nav button:hover{color:#fff}
nav button.active{color:#fff;border-bottom-color:var(--gold)}

main{max-width:1320px;margin:0 auto;padding:22px}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.card h2{font-size:20px;color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card h2 .tag{margin-left:auto;font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.grid{display:grid;gap:18px}
.grid.two{grid-template-columns:1fr 1fr}
.grid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.grid.two,.grid.three{grid-template-columns:1fr}}

.btn{background:var(--navy-3);color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{background:#2f54a0;border-color:#5b7fd0}
.btn.primary{background:var(--red);border-color:var(--red)}
.btn.primary:hover{background:var(--red-2)}
.btn.gold{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:#ff8a8a;border-color:#5a2020}
.btn.danger:hover{background:#3a1010}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=email],input[type=number],select,textarea{background:var(--deep);border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.muted{color:var(--grey)}
.small{font-size:12px}

table{width:100%;border-collapse:collapse}
th{font-family:var(--font-head);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--grey);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid #2c4680;vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.04)}
.num{text-align:right;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.alive{background:rgba(31,191,106,.15);color:var(--green);border:1px solid rgba(31,191,106,.4)}
.pill.out{background:rgba(213,10,10,.15);color:#ff7b7b;border:1px solid rgba(213,10,10,.4)}
.pill.win{background:rgba(255,184,28,.18);color:var(--gold);border:1px solid rgba(255,184,28,.5)}
.pill.paid{background:rgba(31,191,106,.15);color:var(--green)}
.pill.unpaid{background:rgba(255,184,28,.15);color:var(--gold)}
.pill.pending{background:rgba(139,155,184,.15);color:var(--grey)}

.logo{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.logo.lg{width:44px;height:44px}
.logo.xl{width:64px;height:64px}
.team{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.fallback{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--font-head);font-weight:700;font-size:11px;color:#fff;width:28px;height:28px}

/* week selector */
.weeks{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.weeks button{background:var(--deep);border:1px solid var(--line);color:var(--grey);border-radius:6px;padding:6px 0;width:44px;font-family:var(--font-head);font-size:14px;cursor:pointer}
.weeks button.active{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.weeks button.settled{border-color:var(--green);color:var(--green)}
.weeks button.settled.active{color:#1a1200}
.weeks button.live{border-color:var(--red)}
.weeks button.outside{opacity:.35}

/* pick picker */
.overlay{position:fixed;inset:0;background:rgba(3,7,18,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;width:min(1000px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.modal h2{font-size:22px;margin-bottom:6px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.tcard{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:center;position:relative;transition:.12s}
.tcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.tcard .nm{font-family:var(--font-head);font-size:15px;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.tcard .opp{font-size:11px;color:var(--grey);margin-top:2px}
.tcard.used,.tcard.bye,.tcard.final{opacity:.35;cursor:not-allowed;filter:grayscale(1)}
.tcard.used:hover,.tcard.bye:hover,.tcard.final:hover{transform:none;border-color:var(--line)}
.tcard .badge{position:absolute;top:6px;right:6px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--red);color:#fff;font-weight:700}
.tcard.bye .badge{background:#4a6096}
.tcard.selected{border-color:var(--green);box-shadow:0 0 0 2px rgba(31,191,106,.5)}

/* pick table cells */
.pickcell{display:flex;align-items:center;gap:10px}
.pickbtn{display:inline-flex;align-items:center;gap:8px;background:var(--deep);border:1px dashed var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;color:#fff;min-width:170px;text-align:left}
.pickbtn:hover{border-color:var(--gold)}
.pickbtn.has{border-style:solid}
.res{font-family:var(--font-head);font-weight:700;font-size:16px;width:26px;text-align:center}
.res.W{color:var(--green)}.res.L{color:#ff6b6b}.res.T{color:var(--gold)}.res.P{color:var(--grey)}

/* history grid */
.histwrap{overflow:auto}
.hist td,.hist th{padding:5px 6px;text-align:center}
.hist td:first-child,.hist th:first-child{text-align:left;position:sticky;left:0;background:var(--navy-2);z-index:2}
.hcell{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;background:var(--deep)}
.hcell.W{box-shadow:inset 0 0 0 2px var(--green)}
.hcell.L{box-shadow:inset 0 0 0 2px var(--red)}
.hcell.T{box-shadow:inset 0 0 0 2px var(--gold)}
.hcell.NP{color:var(--grey);font-size:11px}
.hcell.wipe{box-shadow:inset 0 0 0 2px #6d5cff}
tr.out td{opacity:.55}

/* results */
.game{display:grid;grid-template-columns:1fr 60px 30px 60px 1fr auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #2c4680}
.game .t{display:flex;align-items:center;gap:10px}
.game .t.home{justify-content:flex-end;text-align:right}
.game input{width:60px;text-align:center;font-family:var(--font-head);font-size:20px;padding:4px}
.game .vs{text-align:center;color:var(--grey);font-family:var(--font-head)}
.game .meta{font-size:11px;color:var(--grey)}
.game.final{background:rgba(31,191,106,.05)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}

/* dashboard */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.bigpot{background:linear-gradient(135deg,#2a4a94,#1b3266);border:1px solid var(--line);border-radius:14px;padding:22px;position:relative;overflow:hidden}
.bigpot:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.04) 22px 24px);pointer-events:none}
.bigpot .amt{font-family:var(--font-head);font-size:64px;font-weight:700;color:var(--gold);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.bigpot .lbl{letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--grey)}
.avatars{display:flex;flex-wrap:wrap;gap:6px}
.av{display:inline-flex;align-items:center;gap:6px;background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px}
.av.out{opacity:.4;text-decoration:line-through}
.feed li{list-style:none;padding:8px 0;border-bottom:1px solid #2c4680;display:flex;gap:10px;align-items:center}
.feed{margin:0;padding:0}
.empty{padding:26px;text-align:center;color:var(--grey);border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;bottom:22px;right:22px;background:#24427f;border:1px solid var(--gold);color:#fff;padding:12px 16px;border-radius:10px;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.6);max-width:360px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--grey);cursor:pointer}
.drop.over{border-color:var(--gold);color:#fff}
.banner{background:linear-gradient(90deg,var(--red),#7a0000);padding:14px 18px;border-radius:12px;margin-bottom:18px;display:flex;align-items:center;gap:14px;font-family:var(--font-head);font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.banner.gold{background:linear-gradient(90deg,var(--gold),#b87d00);color:#1a1200}
.banner .btn{margin-left:auto;font-family:var(--font-body);text-transform:none;letter-spacing:0}
footer{text-align:center;color:var(--grey);font-size:11px;padding:20px}

/* home */
.homehero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,#2b4f9e 0%,#1b3266 55%,#22184a 100%);padding:34px 30px;margin-bottom:18px;box-shadow:0 14px 50px rgba(0,0,0,.35)}
.homehero:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 30px,rgba(255,255,255,.05) 30px 32px);pointer-events:none}
.homehero .kick{letter-spacing:.35em;text-transform:uppercase;font-size:12px;color:var(--gold);font-weight:600}
.homehero h1.big{font-size:64px;line-height:.95;font-weight:700;margin:6px 0 10px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.homehero h1.big span{color:var(--gold)}
.homehero p{max-width:640px;font-size:15px;color:#e6ecff;margin:0 0 18px}
.herostats{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.herostat{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 18px;min-width:140px}
.herostat .v{font-family:var(--font-head);font-size:34px;font-weight:700;line-height:1}
.herostat .l{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin-top:4px}
.herostat.gold .v{color:var(--gold)}.herostat.green .v{color:var(--green)}
.logowall{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.logowall .lw{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;transition:.15s}
.logowall .lw:hover{transform:translateY(-3px);border-color:var(--gold)}
.logowall .lw .ab{font-family:var(--font-head);font-size:12px;letter-spacing:.1em;color:var(--grey);margin-top:6px}
.logowall .fallback{width:52px;height:52px;font-size:15px}
.heroflag{position:absolute;right:-40px;top:-40px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,199,51,.25),transparent 70%);pointer-events:none}
.rules{margin:0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #2c4680;line-height:1.45}
.rules li:before{content:counter(r);flex:none;width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;font-family:var(--font-head);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.rules li b{color:var(--gold)}
.datebox{display:flex;gap:10px;flex-wrap:wrap}
.date{flex:1;min-width:150px;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.date .d{font-family:var(--font-head);font-size:20px;font-weight:600}
.date .l{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--grey)}
.robar{background:linear-gradient(90deg,#24427f,#1b3266);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--grey);display:flex;gap:10px;align-items:center;margin-bottom:14px}
body.ro .edit{display:none!important}
body.ro .pickbtn{border-style:solid;cursor:default;pointer-events:none}
body.ro nav button[data-v=entries],body.ro nav button[data-v=settings]{display:none}
/* Remote additions reuse the original palette and components. */
.rules{font-size:80%}
.rules li:before{font-size:12.8px}
.brand .nfl-logo{width:46px;height:52px;object-fit:contain;flex:none}
input[type=password]{background:var(--deep);border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 10px}
body.player nav{display:flex}
main{max-width:1650px}
body.player main{max-width:1650px}
body.player .teamgrid button{color:var(--white);font:inherit}
body.player .season{display:flex;flex-wrap:wrap;gap:10px}
.personal-link{overflow-wrap:anywhere;min-width:180px}
.personal-link.unpaid-link{opacity:.55}
@media(max-width:900px){body.player .hdr-top{padding:12px;gap:12px}body.player .brand h1{font-size:25px}body.player .hdr-stats{margin-left:0;gap:6px}body.player .stat{min-width:76px;padding:6px 8px}body.player main{padding:14px}body.player .card{padding:16px}body.player .teamgrid{grid-template-columns:repeat(2,minmax(0,1fr))}body.player .card h2{flex-wrap:wrap}}

.nav-icon{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fixture-card{display:grid;grid-template-columns:minmax(0,1fr) 78px;align-items:center;gap:8px;min-width:0;min-height:54px;height:100%;padding:8px;border:1px solid #1b2a4a;border-radius:8px;background:rgba(8,22,52,.18);font-size:11px;overflow:hidden}
.fixture-matchup{display:flex;align-items:center;gap:4px;min-width:0}
.fixture-matchup .logo{width:21px;height:21px;flex:none}
.fixture-name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.fixture-at{color:var(--grey);flex:none}
.fixture-time{width:78px;max-width:100%;justify-self:end;text-align:right;white-space:normal;line-height:1.3;font-variant-numeric:tabular-nums;color:var(--grey);overflow-wrap:normal}

@media(min-width:601px){
  nav{gap:8px;padding:8px 22px}
  nav button{margin:0;padding:9px 18px;border:1px solid rgba(58,90,156,.65);border-radius:8px;background:rgba(36,66,127,.32);transition:background .15s,border-color .15s,color .15s,transform .15s}
  nav button:hover{background:var(--navy-3);border-color:#5b7fd0;transform:translateY(-1px)}
  nav button.active{background:var(--navy-3);border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold),0 4px 14px rgba(0,0,0,.22)}
}

/* Compact branding and hero, with layouts sized for each viewport. */
.brand{gap:10px;min-width:0}
.brand h1{font-size:25px}
.brand h1 small{font-size:10px;letter-spacing:.25em;margin-top:3px}
.brand .nfl-logo{width:36px;height:42px}
.hdr-top{gap:14px;padding:10px 22px}
.hdr-stats{gap:7px;min-width:0}
.stat{min-width:76px;padding:6px 10px}
.stat .v{font-size:20px}
.stat .l{font-size:9px;letter-spacing:.12em}
.homehero{padding:22px 24px}
.homehero::before{content:none}
.homehero .kick{font-size:10px;letter-spacing:.22em}
.homehero h1.big{font-size:44px;line-height:1.08;margin:8px 0 12px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.homehero p{font-size:14px;line-height:1.5;max-width:680px;margin-bottom:14px}
.herostats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:660px;gap:10px;margin-top:0}
.herostat{min-width:0;padding:10px 12px}
.herostat .v{font-size:26px;overflow-wrap:anywhere}
.herostat .l{font-size:9px;letter-spacing:.12em}
.hero-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.dashboard-utilities{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:18px 0 4px}.dashboard-utilities .btn{text-decoration:none;background:rgba(36,66,127,.55)}.dashboard-utilities .admin-link{border-color:var(--green);background:rgba(31,191,106,.14)}
.bigpot:before{content:none}
.weeks button:disabled{opacity:.38;cursor:not-allowed;border-color:#334d82;color:#7584aa}.tcard.used{opacity:.55;background:rgba(111,24,42,.5);border-color:#783447;filter:grayscale(.72)}.tcard.used:hover{border-color:#783447}
.member-week-status{position:absolute;z-index:2;top:18px;right:18px;min-width:104px;border:1px solid currentColor;border-radius:10px;padding:9px 12px;color:#fff;text-align:center;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.28)}

async function publishLive(){
  if(!HOSTED) return toast('Publishing only works on the hosted version.');
  if(!artifactNS){ artifactNS = await window.claude.use('artifact'); }
  if(!artifactNS) return toast('Publishing is not available in this view.');
  const html=bakedPage();
  if(!html) return toast('Could not build the page for publishing.');
  toast('Publishing…',2000);
  try{
    await artifactNS.publish(html);
    PUBLISHED_AT=S.updatedAt; save({uiOnly:true}); render();
    toast('Published. Everyone with the link now sees this version.');
  }catch(e){
    if(e?.code==='not_writer'||e?.code==='not_granted'){ ADMIN=false; try{localStorage.setItem('lms-admin','0');}catch(_){ } render(); toast('This link is view-only for you. Only the owner can publish changes.'); }
    else if(e?.code==='conflict'){ toast('A newer version was just published; reloading.'); }
    else toast('Publish failed: '+(e?.message||e));
  }
}
function bakedPage(){
  const json=JSON.stringify(stateForPublish()).replace(/<\//g,'<\\/');
  const html=SRC.replace(/(<script id="lms-state" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+json+b);
  return html.includes(json.slice(0,40)) ? html : null;
}
// Download a copy of this page with the current standings baked in, ready to upload to any web host.
function exportLivePage(){ const html=bakedPage(); if(!html) return toast('Could not build the page.'); download('index.html', html, 'text/html'); toast('Upload index.html to your web host to update the shared page.'); }
function toggleAdmin(){ if(REMOTE) return remoteAdmin(); ADMIN=!ADMIN; try{localStorage.setItem('lms-admin',ADMIN?'1':'0');}catch(e){} S=load(); render(); toast(ADMIN?'Admin mode on. Make your changes, then hit Publish.':'Admin mode off.'); }
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = n => '£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtDate = iso => new Date(iso).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'});
const fmtDay = iso => new Date(iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'Europe/London'});

const L = createLMSLogic(SCHEDULE);
gamesByWeek = L.gamesByWeek; teamGame = L.teamGame;
const teamResult = (abbr,w) => L.teamResult(S,abbr,w);
const weekSettled = w => L.weekSettled(S,w);
const weekHasResults = w => L.weekHasResults(S,w);
const currentRound = () => L.currentRound(S);
const roundEndWeek = r => L.roundEndWeek(r);
const defaultWeek = () => L.defaultWeek(S,serverNow());
const previousWeeksFinalised = (r,w) => L.previousWeeksFinalised(S,r,w,serverNow());
const isPickLost = code => L.isPickLost(S,code);
const computeRound = r => L.computeRound(S,r);
const roundEntries = (r=currentRound()) => L.entriesForRound(S,r);
const entryPaid = (e,r=currentRound(),comp=computeRound(r)) => L.isPaid(e,r,comp);
const prizePot = (r=currentRound(),comp=computeRound(r)) => L.prizePot(S,r,comp);
const usedTeams = (entryId,r,comp,uptoWeek) => L.usedTeams(S,entryId,r,comp,uptoWeek);
const aliveAtWeek = (comp,w) => L.aliveAtWeek(S,comp,w);
const isAliveForWeek = (comp,w,id) => L.isAliveForWeek(S,comp,w,id);

/* ===================== UI HELPERS ===================== */
function badge(abbr, cls='logo'){
  const t=TEAMS[abbr]; const size=cls.includes('xl')?64:cls.includes('lg')?44:28; const fs=Math.round(size*0.36);
  return `<span class="fallback" title="${esc(t.name)}" style="background:#${t.color||'333'};box-shadow:inset 0 0 0 3px #${t.alt||'fff'}55;width:${size}px;height:${size}px;font-size:${fs}px">${abbr}</span>`;
}
function logoImg(abbr, cls='logo'){
  const t=TEAMS[abbr]; if(!t) return '';
  if(!IMAGES_OK) return badge(abbr,cls);
  return `<img class="${cls}" src="${t.logo}" alt="${esc(t.name)}" title="${esc(t.name)}" onerror="this.outerHTML='<span class=&quot;fallback&quot; style=&quot;background:#${t.color||'333'}&quot;>${abbr}</span>'">`;
}
function teamChip(abbr, cls='logo'){ const t=TEAMS[abbr]; return t? `<span class="team">${logoImg(abbr,cls)}<span>${esc(t.name)}</span></span>` : '<span class="muted">-</span>'; }
function toast(msg, ms=3200){ const el=document.createElement('div'); el.className='toast'; el.innerHTML=msg; document.getElementById('toastRoot').appendChild(el); setTimeout(()=>el.remove(),ms); }
function modal(html){ const root=document.getElementById('modalRoot'); root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function setView(v){ S.ui.view=v;if(!['results','standings'].includes(v))S.ui.round=null;save({uiOnly:true}); render(); if(accountPage==='/admin')window.scrollTo(0,0); }
function setWeek(w){ S.ui.week=w; save({uiOnly:true}); render(); }
function selectedRound(){return S.rounds.find(r=>r.n===Number(S.ui.round))||currentRound();}
function roundViewWeek(r,comp){const current=currentRound(),fallback=r.n===current.n?defaultWeek():(comp.finalWeek||r.endWeek||r.startWeek);if(!Number.isInteger(S.ui.week)||S.ui.week<r.startWeek||S.ui.week>roundEndWeek(r))S.ui.week=fallback;return S.ui.week;}
function setRoundView(n){const r=S.rounds.find(r=>r.n===n)||currentRound(),comp=computeRound(r);S.ui.round=r.n;S.ui.week=r.n===currentRound().n?defaultWeek():(comp.finalWeek||r.endWeek||r.startWeek);save({uiOnly:true});render();window.scrollTo(0,0);}
function roundArchiveBar(r){if(S.rounds.length<2)return '';return `<div class="round-archive-nav"><div class="round-archive-copy"><strong>Round archive</strong><span>View every completed round</span></div><div class="round-archive-buttons" role="navigation" aria-label="Choose competition round">${S.rounds.map(x=>`<button type="button" class="btn ${x.n===r.n?'active':''}" aria-current="${x.n===r.n?'page':'false'}" onclick="setRoundView(${x.n})">Round ${x.n}${x.endWeek?' · complete':''}</button>`).join('')}</div></div>`;}
function entryName(id){ const e=S.entries.find(x=>x.id===id); if(!e)return '?'; if(e.label)return /^\d+$/.test(e.label)?`${e.name} ${e.label}`:`${e.name} (${e.label})`;const same=S.entries.filter(x=>x.name===e.name).sort((a,b)=>(a.created||0)-(b.created||0)||a.id.localeCompare(b.id));return same.length>1?`${e.name} ${same.findIndex(x=>x.id===e.id)+1}`:e.name; }
function weekBar(r, comp, extraClass=''){
  const cur=S.ui.week;
  let h='<div class="weeks">';
  for(let w=1;w<=WEEKS;w++){
    const inR = w>=r.startWeek && w<=roundEndWeek(r);
    const cls=[w===cur?'active':'', weekSettled(w)?'settled':(weekHasResults(w)?'live':''), inR?'':'outside'].join(' ');
    h+=`<button class="${cls}" onclick="setWeek(${w})" title="Week ${w}">${w}</button>`;
  }
  return h+'</div>';
}

function memberHelpItems(){
  const fee=gbp(S.settings.fee);
  return [
    ['Getting started','How do I join?',`<p><strong>New players must register before trying to sign in.</strong> Open <a href="/signup">Register</a> and enter your first name, last name, email address and a password of at least seven characters. Your member account is created straight away, with no confirmation email.</p><p>Registration does not enter you into the competition. On your Dashboard, press <strong>Add an entry</strong> when you want to join the current round. That unpaid entry is counted only after you add it.</p>`],
    ['Getting started','How do I pay and become active?',`<p>Contact <strong>Connor or Havo</strong> to make your ${fee} payment. There are no online payments in the app.</p><p>Once Connor, Havo or another administrator marks your entry as paid, your Dashboard changes from <strong>Inactive</strong> to <strong>Active</strong> and you can submit a pick.</p><div class="help-callout">Payment is recorded separately for each entry, including entries belonging to an owner or admin.</div>`],
    ['Getting started','Why does my account say inactive or payment pending?',`<p>Your account works, but your competition entry has not yet been marked paid for the current round or rollover. Contact Connor or Havo. You cannot submit or change a pick until the entry is active.</p><p>If you have just paid, refresh the page after an administrator confirms it.</p>`],
    ['Getting started','Can I enter more than once?',`<p>Yes. Open <strong>Dashboard</strong> and choose <strong>Add another entry</strong>. Your entries are numbered under your full name for the current round, for example <strong>Rob O’Shea 1</strong> and <strong>Rob O’Shea 2</strong>.</p><p>Each entry costs ${fee} and is managed separately. A new entry starts unpaid, so Connor, Havo or another admin must approve its payment before it can make a pick. Use the named entry buttons on Dashboard to switch between each entry’s status, current pick, history and remaining teams.</p>`],
    ['Getting started','How do I sit out or remove an entry?',`<p>If you are not playing this round, press <strong>I’m not participating</strong> on Dashboard. You stay in the Members list but are not counted as an entry.</p><p>You can remove an individual unpaid entry from Dashboard. Once an entry is paid, an administrator must mark it unpaid before it can be removed or before you can sit out the round.</p>`],
    ['Picks','How do I make my weekly selection?',`<ol><li>Sign in and open <strong>Account</strong>. If you have more than one entry, select the numbered entry you want to manage.</li><li>Check that it is Active and choose <strong>Make your pick</strong>, or open <strong>Picks</strong> from the navigation.</li><li>Check that the correct week is selected.</li><li>Tap the team you want. The team card shows its opponent and game day.</li><li>Review the selected team and press <strong>Confirm pick</strong>.</li></ol><div class="help-callout">Your selection is saved only after you press Confirm pick. Repeat this separately for every paid entry. The Account and Picks pages then show the team badge in that entry’s history.</div>`],
    ['Picks','How do I change a pick?',`<p>Open <strong>Picks</strong>, choose the week and press <strong>Change pick</strong>. Select a different team, review it, then press <strong>Confirm pick</strong>.</p><p>You can change a selection as often as you like until that week’s deadline. The newest confirmed selection replaces the old one.</p>`],
    ['Picks','When can I pick for the next week?',`<p>Once every game in the current NFL week is marked final, the app calculates the outcomes and begins a six-hour review window. The following week stays locked during that period.</p><p>After six hours, the next week opens automatically for entries that are still active and paid. An open app checks every 45 seconds; otherwise it opens on your next visit or refresh.</p>`],
    ['Picks','What if I cannot sign in before the deadline?',`<p>Contact Connor, Havo or another administrator immediately. Tell them your full numbered entry name, the week and the team you want.</p><p>An administrator can record or update the pick for you, including after the normal member deadline when there is a genuine access problem. Ask them to confirm that it has been saved. The normal team-use and bye-week rules still apply.</p>`],
    ['Picks','Can I remove a pick completely?',`<p>Before the deadline, open that week in Picks, press <strong>Change pick</strong>, then use <strong>Clear pick</strong>. Make a new selection and confirm it before the deadline or you will have no pick for the week.</p>`],
    ['Picks','When is the weekly deadline?',`<p>The deadline is <strong>one hour before the first NFL kick-off of that week</strong>. The exact UK date and time appears on your Dashboard and at the top of Picks.</p><p>When the deadline passes, selections are locked. Later games in the same week do not extend the deadline.</p>`],
    ['Picks','Why can’t I select a team?',`<p>A team may be unavailable because the previous week is not finalised or is still in its six-hour review window, you already used it since the last reset, it has a bye, its game is no longer available, the weekly deadline has passed, your entry is unpaid, or your entry has been eliminated.</p><p>The team picker labels unavailable teams where possible. Previously used teams have a muted red tint; future weeks remain locked until the competition is ready to move on.</p>`],
    ['Picks','Can I use the same team twice?',`<p>No. Each team can be used once between resets. After you confirm a team, it remains unavailable in later weeks.</p><p>A rollover or a new round resets the list, so all 32 teams become available again.</p>`],
    ['Picks','Can other members see my current pick?',`<p>Yes. Every signed-in member can see all submitted picks for paid entries, including the current week, in <strong>Standings</strong> and the compact weekly picks list.</p><p>Selections are shared as soon as they are saved. People who are not signed in cannot see protected current-week picks.</p>`],
    ['Results and standings','Where can I see scores and results?',`<p>Open <strong>Results</strong> to see that week’s fixtures, scores and final results. Results appear after an administrator fetches or enters them.</p><p>A win keeps the entry in. A loss eliminates it. Under the current rules, a tie also counts as a loss.</p>`],
    ['Results and standings','How do I see who is still in?',`<p>Open <strong>Standings</strong>. Every active person appears on a separate line with the badges of the teams they have picked so far. The page separates players who are still standing from those who have been eliminated.</p>`],
    ['Results and standings','How do I view an earlier round?',`<p>Open <strong>Standings</strong> or <strong>Results</strong> and use the Round archive buttons at the top. A completed round keeps its entries, weekly picks, match results, winner and full elimination feed.</p><p>You can also use <strong>Previous rounds</strong> at the bottom of Dashboard once the next round has opened.</p>`],
    ['Results and standings','What do Active, Inactive and Eliminated mean?',`<ul><li><strong>Active:</strong> paid and still eligible in the current round.</li><li><strong>Inactive:</strong> not paid for the current round or rollover, so no pick can be submitted.</li><li><strong>Eliminated:</strong> knocked out by a losing, tied or missed pick under the competition rules.</li></ul>`],
    ['Results and standings','Where will I see competition announcements?',`<p>Payment reminders, deadline changes and competition updates appear in a highlighted banner near the top of member pages. Refresh the app if an administrator tells you a new notice has been posted.</p>`],
    ['Rollover','What happens in a rollover?',`<p>If every remaining player loses in the same week, the competition rolls over. Everyone comes back in, including people eliminated earlier, and all 32 teams become available again.</p><p>Every entry must pay ${fee} again. Contact Connor or Havo. Anyone not marked paid for the rollover stays eliminated and cannot submit the next pick.</p>`],
    ['Account and phone','How do I change my password or sign out?',`<p>Choose <strong>Account</strong> at the top of the app, then use <strong>Change password</strong>. Enter your current password and a new password of at least seven characters.</p><p>Use <strong>Sign out</strong> at the top of the app when you have finished, especially on a shared device.</p>`],
    ['Account and phone','What if I forget my password?',`<p>Contact an administrator. They can create a private reset link that works once and expires after one hour. Open the link, set a new password of at least seven characters, then sign in normally.</p>`],
    ['Account and phone','How do I save NFL LMS to my phone?',`<p><strong>iPhone or iPad:</strong> open the site in Safari, tap Share, choose <strong>Add to Home Screen</strong>, then tap Add.</p><p><strong>Android:</strong> open the site in Chrome, open the browser menu, choose <strong>Add to Home screen</strong> or <strong>Install app</strong>, then confirm.</p><p>The NFL LMS icon and name will appear with your other apps.</p>`],
    ['Troubleshooting','My pick does not appear to have saved. What should I do?',`<ol><li>Check that you pressed <strong>Confirm pick</strong>.</li><li>Check that the entry is Active and the deadline has not passed.</li><li>Refresh Picks and look for the team badge in the selected week.</li><li>If it is still missing, contact Connor or Havo before the deadline and tell them the entry name, week and team.</li></ol>`]
  ];

function adminHelpItems(){
  const fee=gbp(S.settings.fee);
  return [
    ['Access and roles','How do I enter and leave the admin area?',`<p>Sign in, then choose <strong>Admin</strong> at the top of the app. Use the admin navigation to open each management area.</p><p>Choose <strong>Exit admin</strong> at the top to return to your own member Dashboard and picks.</p>`],
    ['Access and roles','What is the difference between owner and admin?',`<p>The owner has complete control, including assigning admin roles, linking entries to accounts, enabling or disabling accounts, changing site and competition settings, and using backup or reset controls.</p><p>Admins have the full day-to-day management area for members, entries, payments, picks, results and the competition overview. Site settings, role assignment, backup, restore and reset controls remain owner-only.</p>`],
    ['Access and roles','Can owners and admins also enter and be marked paid?',`<p>Yes. Account role and competition payment are separate. An owner or admin can have one or more competition entries and each of those entries can be marked Paid or Unpaid exactly like a member entry.</p><p>Open <strong>Entries & payments</strong>, find the staff member’s competition entry and press its payment status. Their owner or admin access remains unchanged.</p>`],
    ['Entries and payments','How do I add one person manually?',`<ol><li>Open <strong>Entries & payments</strong>.</li><li>Enter the player’s full name.</li><li>Add an entry label if they have more than one entry.</li><li>Add their email if known and choose whether they have paid.</li><li>Press <strong>Add</strong>.</li></ol><p>An admin can manage the entry as soon as it is active. The owner can later connect it to the member’s account.</p>`],
    ['Entries and payments','How do I add several entries quickly?',`<p>Use <strong>Quick paste</strong> for one entry per line. Each line can contain Name, Label, Email and Paid, separated by commas or tabs.</p><p><strong>Owner only:</strong> the spreadsheet importer is kept in the owner area for controlled legacy imports. Ordinary admins do not see it because new members should register and set their own password.</p>`],
    ['Entries and payments','How do I mark an entry paid or unpaid?',`<p>Open <strong>Entries & payments</strong>. An unpaid entry shows a clear <strong>Mark paid</strong> button in the Payment column. The entry becomes Active as soon as it is paid.</p><p>A paid entry shows a Paid control, which you can press to correct it back to unpaid. This works for members, admins and the owner. If one person has several entries, mark each entry separately.</p>`],
    ['Entries and payments','How are rollover payments recorded?',`<p>After a rollover, the Payment column changes to the rollover fee for the reset week. Mark every ${fee} repayment there. Only repaid entries return to active play.</p><p>Previous fees remain in the prize pot. An unpaid rollover entry stays eliminated and cannot submit a pick.</p>`],
    ['Entries and payments','How do I edit or remove an entry?',`<p>Edit the name, label or email directly in the Entries table. Changes save when you leave the field.</p><p>Use <strong>Remove</strong> only when the entry should be deleted. Removing it also deletes all of its picks. Export a backup first if there is any doubt.</p>`],
    ['Entries and payments','How do extra entries work?',`<p>A member uses <strong>Add another entry</strong> on Dashboard. The app numbers every account entry under the member’s full name for the round, such as <strong>Rob O’Shea 1</strong> and <strong>Rob O’Shea 2</strong>.</p><p>Each entry costs ${fee}, starts unpaid and has its own payment badge, weekly picks, history and remaining-team list. Approve payment by marking each new entry Paid in <strong>Entries & payments</strong>. Until then, that entry cannot submit or change a pick.</p>`],
    ['Members and accounts','How does member sign-up work?',`<p>Members enter first name, last name, email and a password of at least seven characters. They are signed up immediately with no confirmation email. They appear in Members but do not become a competition entry automatically.</p><p>The member chooses <strong>Add an entry</strong> on Dashboard to join a round. Each entry starts unpaid and needs its own payment approval.</p>`],
    ['Entries and payments','How do I mark someone as sitting out?',`<p>Open <strong>Entries & payments</strong>, find the member and press <strong>Mark sitting out</strong> in the Status column. This removes all of their unpaid current-round entries and picks while keeping their account in the Members list.</p><p>If any of their entries is paid, mark every entry unpaid first. A member can also sit themselves out from their own Dashboard.</p>`],
    ['Members and accounts','How do I correct a member’s name?',`<p>Open <strong>Members & roles</strong>. Enter both the member’s first name and last name, then press <strong>Save name</strong>. Accounts with a missing surname are clearly flagged.</p><p>The corrected name is applied to all entries owned by that member. Their hidden member ID does not change, so their email, role, payment status, picks and history stay connected.</p><div class="help-callout">For an account-owned entry, change the name in Members & roles. Entries & payments keeps account-owned names read-only to prevent the account and its entries becoming inconsistent.</div>`],
    ['Members and accounts','How do I connect a manual entry to an account?',`<p>Owner only: open <strong>Members & roles</strong>, find the manual entry under Connect entries to accounts, and select the correct email address.</p><p>Verify the person carefully first. Connecting an entry gives that account control of its picks and history.</p>`],
    ['Members and accounts','How do I make someone an admin?',`<p>Owner only: open <strong>Members & roles</strong>, find the person, choose Admin in the Role column and press <strong>Save</strong>. Their existing sign-in remains active and the full day-to-day Admin area is available immediately.</p><p>Their competition entry and payment status do not change when their role changes. They can use <strong>Exit admin</strong> whenever they need their own member Dashboard and picks. Site settings, role assignment, backup, restore and reset remain owner-only.</p>`],
    ['Members and accounts','How do I see exactly what another account sees?',`<p>Owner only: open <strong>Members & roles</strong> and press <strong>View as member</strong> or <strong>View as admin</strong> beside the person. The app opens their real account with the access, entries, payments, picks, history and restrictions attached to their role.</p><p>A red account-view banner remains visible while you are using their account. Any entry, pick or admin change affects their real account and is recorded as an owner action. Use the Exit button in that banner to return to your Admin home.</p>`],
    ['Members and accounts','How do I help someone who forgot their password?',`<p>Open <strong>Members & roles</strong> and press <strong>Reset password</strong> beside the member. Copy the private link and send it directly to them.</p><p>The link works once and expires after one hour. Never post it in a group chat.</p>`],
    ['Members and accounts','How do I disable or re-enable an account?',`<p>Owner only: use the Disable or Enable button in <strong>Members & roles</strong>. A disabled user cannot sign in.</p><p>Disabling account access does not delete the competition entry or its picks. Deal with its payment and playing status separately in Entries & payments.</p>`],
    ['Picks','How do I check who has not picked?',`<p>Open <strong>Manage picks</strong> and select the week. The summary shows how many eligible entries have picked, and the outstanding section lists missing selections.</p><p>Press <strong>Share pick reminder</strong> to review a message containing those names, the deadline and the Picks link. You can edit it, share it to WhatsApp or copy it.</p>`],
    ['Messages','How do I send WhatsApp reminders?',`<ol><li>Open <strong>Reminders</strong> in the admin area.</li><li>Choose Missing picks, Awaiting payment or Not entered this round.</li><li>Check the names and edit the prepared message if needed.</li><li>Press <strong>Share to WhatsApp</strong>.</li><li>Choose WhatsApp if prompted, select the competition group and press Send.</li></ol><p>On a computer, use <strong>Copy message</strong> if WhatsApp is not shown. The list is rebuilt from the live competition each time, and no member phone numbers are stored.</p>`],
    ['Picks','How do I add or change a member’s pick?',`<ol><li>Open <strong>Manage picks</strong>.</li><li>Choose the correct week.</li><li>Find the member’s complete numbered entry, including unpaid or eliminated entries when relevant.</li><li>If the entry is unpaid and payment has been received, press <strong>Mark paid</strong>.</li><li>Open its team picker and choose the requested team.</li><li>Review the entry, week, old pick and new pick on the confirmation screen.</li><li>Press <strong>Save admin pick</strong>.</li></ol><p>The change is immediate and appears in that entry’s pick history. Use the same steps for your own owner/admin entry.</p>`],
    ['Picks','How do I clear an incorrect pick?',`<p>In Manage picks, find the entry and week, then use the clear control beside its current selection. Add the correct selection straight away if one is required.</p>`],
    ['Picks','Why is a team unavailable in the picker?',`<p>The entry may already have used it since the last reset, the team may have a bye, or the game may have finished. The picker labels used and unavailable teams.</p><p>During an exceptional correction, check the competition rules before overriding a normal restriction.</p>`],
    ['Picks','When are members locked out?',`<p>Members can select only the first open week. After every fixture in the preceding week is marked final, a six-hour review window runs before the following week unlocks. Picks and changes then close one hour before the first kick-off of the open week.</p><p><strong>Manage picks remains available to owners and admins for genuine corrections and competition management.</strong> A deadline override is recorded internally.</p><p>The override does not make bye teams or teams already used since the last reset valid.</p>`],
    ['Results','How do I fetch live scores?',`<p>Open <strong>Results</strong>, select the week and use the fetch scores button. The app retrieves available NFL scores and updates completed games.</p><p>Check the imported scores against a trusted source before treating the week as settled.</p>`],
    ['Results','How do I enter a result manually?',`<p>Open Results, select the correct week, enter the away and home scores for the fixture and mark the game final when it has finished. Save the changes.</p><p>Final results drive wins, losses, eliminations, rollovers and winners, so verify the teams and scores first.</p>`],
    ['Results','How do I correct a score or final status?',`<p>Return to the fixture in Results, correct the score or clear its final status, then save. The standings recalculate from the corrected data.</p><p>Check the Dashboard and Standings afterwards to confirm the expected entries are active or eliminated.</p>`],

function setScore(gid,side,val){ const r=S.results[gid]||{hs:null,as:null,final:false}; r[side]=val===''?null:+val; S.results[gid]=r;advanceRoundAfterResults();save();render(); }

function setFinal(gid,on){ const r=S.results[gid]||{hs:null,as:null,final:false}; if(on&&(r.hs==null||r.as==null)){ toast('Enter both scores before marking final.'); render(); return;} r.final=on; S.results[gid]=r;const transition=advanceRoundAfterResults();save(); render();resultReviewToast(transition,SCHEDULE.games.find(g=>g.id===gid)?.week); }

async function fetchWeekResults(w){

async function download(name, content, type){

function wireDrop(){

function importFile(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});

      if(!rows.length) return toast('That file looks empty.');
      previewImport(rows,file.name);
    }catch(e){ toast('Could not read file: '+e.message); }

}
function previewImport(rows,fname){
  const hdr=rows[0].map(h=>String(h).toLowerCase().trim());

    <div style="max-height:50vh;overflow:auto;margin:12px 0"><table><thead><tr><th>Name</th><th>Label</th><th>Email</th><th>Paid</th></tr></thead><tbody>

function loadDemo(){

  S=defaultState();
  const names=['Rob','Rob','Dave Smith','Gary','Steve H','Mick','Paul T','Jonesy','Kev','Lee','Andy B','Chris','Tony','Big Sam','Nige','Darren'];
  names.forEach((n,i)=>addEntry(n, n==='Rob'?`Team ${i+1}`:'', '', i%3!==0));
  const w1=gamesByWeek(1);
  // random-ish week 1 picks and results
  w1.forEach((g,i)=>{ const hs=17+((i*7)%21), as=10+((i*11)%24); S.results[g.id]={hs,as,final:true}; });
  const pool=w1.flatMap(g=>[g.home,g.away]);
  S.entries.forEach((e,i)=>{ S.picks[e.id]={1:pool[(i*3)%pool.length]}; });
  // make sure most survive
  S.entries.forEach((e,i)=>{ if(i%4!==3){ const t=S.picks[e.id][1]; const r=teamResult(t,1); if(r.code!=='W'){ const g=teamGame(t,1); const other=g.home===t?g.away:g.home; S.picks[e.id][1]=other; } } });
  // week 2 picks for survivors, no results
  const comp=computeRound(currentRound()); const w2=gamesByWeek(2); const pool2=w2.flatMap(g=>[g.home,g.away]);
  S.entries.forEach((e,i)=>{ if(comp.alive.has(e.id)){ let k=(i*5)%pool2.length; while(pool2[k]===S.picks[e.id][1]) k=(k+1)%pool2.length; S.picks[e.id][2]=pool2[k]; } });
  S.ui.week=2; if(REMOTE)remoteReplacePicks=true; save(); setView('dash'); toast('Demo data loaded');
}

function updateLiveStatus(){const el=document.getElementById('liveStatus');if(el){el.textContent=liveStatus;el.style.color=liveStatus==='Save failed'?'var(--red-2)':'';}}
async function apiRequest(path,body,key=remoteKey){
  const headers={'x-lms-request':'1'};
  if(body!==undefined)headers['Content-Type']='application/json';
  const response=await fetch(path,{method:body===undefined?'GET':'POST',headers,cache:'no-store',...(body===undefined?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(20000)});
  const data=await response.json();
  if(data.serverTime){serverEpoch=new Date(data.serverTime).getTime();serverMonotonic=performance.now();}
  if(!response.ok)throw Object.assign(new Error(data.message||'Could not complete that request.'),{code:data.error,status:response.status});
  return data;
}
function applyRemote(data,sequence=remoteSequence){
  remoteRevision=data.revision||remoteRevision;
  if(sequence===remoteSequence){const ui=S.ui;S=hydrate(data);S.ui=ui;}
  else {
    // Keep edits made while a previous save was travelling to the server.
    S.entries.forEach(e=>{const saved=data.entries.find(x=>x.id===e.id);if(saved)e.code=saved.code;});
    if(!remoteReplacePicks)S.picks=data.picks;
    S.updatedAt=data.updatedAt;
  }
  ADMIN=data.admin===true&&accountPage==='/admin';
}
function queueRemote(work){
  remoteWrites++;liveStatus='Saving…';updateLiveStatus();
  const job=remoteQueue.then(work);
  remoteQueue=job.catch(()=>{});
  return job.then(data=>{remoteLastError=null;return data;}).catch(error=>{
    remoteLastError=error;toast(esc(error.message));throw error;
  }).finally(()=>{remoteWrites--;liveStatus=remoteLastError?'Save failed':remoteDirty||remoteWrites?'Saving…':'✓ Live';updateLiveStatus();});
}
function flushRemote(){
  clearTimeout(remoteTimer);
  if(!REMOTE||!ADMIN)return Promise.resolve();
  return queueRemote(async()=>{
    if(!remoteDirty)return;
    const sequence=remoteSequence;
    const body={settings:S.settings,entries:S.entries,results:S.results,rounds:S.rounds,baseRevision:remoteRevision,...(remoteReplacePicks?{replacePicks:S.picks}:{})};
    const data=await apiRequest('/api/admin/state',body);
    if(sequence===remoteSequence){remoteDirty=false;remoteReplacePicks=false;}
    applyRemote(data,sequence);
    // Do not destroy a partly typed entry/import form when autosave completes.
    if(!document.querySelector('#main input:focus,#main textarea:focus,#main select:focus'))render();
    else refreshPersonalLinks();
  });
}
async function retryRemote(){
  if(remoteLastError?.code==='conflict'){
    modal(`<h2>Competition changed</h2><p>Another organiser saved changes. Reload the shared competition before editing again.</p><div class="row">${accountUser?.role==='owner'?'<button class="btn" onclick="exportBackup()">Export backup</button>':''}<button class="btn primary" onclick="location.reload()">Reload competition</button><button class="btn" onclick="closeModal()">Close</button></div>`);return;
  }
  try{await flushRemote();}catch{}
}

function reminderNameParts(name){const parts=String(name||'').trim().split(/\s+/).filter(Boolean),surname=parts.pop()||'',first=parts.join(' ');return [surname,first];}

    if(PLAYER_CODE){const data=await apiRequest('/api/me?entryId='+encodeURIComponent(PLAYER_CODE),undefined,'');if(sequence!==remoteSequence || playerSending)return;const changed=!playerMe||JSON.stringify(data.picks)!==JSON.stringify(playerMe.picks)||data.state.updatedAt!==S.updatedAt;acceptMe(data);if(changed)render();}

async function saveMemberRole(userId){const role=document.getElementById('role-'+userId)?.value;try{await accountCall('role',{userId,role});await renderMembers();toast(role==='admin'?'Admin access saved. Their full admin area is available immediately.':'Member access saved.');}catch(e){toast(esc(e.message));}}
async function memberAction(action,userId,extra={}){if(action==='participation'&&extra.status==='not_participating'&&!confirm('Mark this member as not participating? Any unpaid current-round entries and their picks will be removed.'))return;try{const data=await accountCall(action,{userId,...extra});if(data.resetToken){modal('<h2>Private password reset link</h2>'+ `<p>Send this link privately to the member. It expires in one hour and works once.</p><input id="resetLink" readonly value="${esc(location.origin+'/reset-password#token='+data.resetToken)}"><button class="btn" onclick="copyText(document.getElementById('resetLink').value)">Copy link</button>`);}else{if(action==='entry'||action==='participation')applyRemote(await apiRequest('/api/state'));await renderMembers();}}catch(e){toast(esc(e.message));}}
async function setAdminParticipationFromEntries(userId){if(!confirm('Mark this member as sitting out this round? All of their unpaid current-round entries and picks will be removed.'))return;try{await accountCall('participation',{userId,status:'not_participating'});applyRemote(await apiRequest('/api/state'));const me=await accountCall('me');accountSummary=me.summary;render();toast('Member marked as sitting out this round.');}catch(e){toast(esc(e.message));}}
async function assignEntry(entryId,userId){if(!userId)return;try{await accountCall('assign',{entryId,userId});applyRemote(await apiRequest('/api/state'));toast('Entry connected.');}catch(e){toast(esc(e.message));}await renderMembers();}
/* ACCOUNT:END */
bootRemote().then(()=>{
  if(new URLSearchParams(location.search).get('display-check')!=='1')return;
  const panel=document.createElement('section');
  panel.setAttribute('aria-label','Display check');
  panel.style.cssText='position:fixed;z-index:9999;left:8px;right:8px;bottom:8px;max-width:440px;margin:auto;background:#fff;color:#111;padding:16px;border:2px solid #ffc733;border-radius:12px;font:16px/1.4 system-ui;box-shadow:0 4px 30px #0008';
  panel.innerHTML='<b>Display check</b><p style="margin:8px 0">Copy these details and paste them into our chat.</p><textarea readonly aria-label="Display details" style="display:block;width:100%;height:110px;font:16px/1.3 monospace;color:#111;background:#f1f3f6;padding:8px;border:1px solid #777"></textarea><button type="button" style="margin-top:10px;padding:10px;background:#132650;color:white;border:0;border-radius:6px">Copy display details</button> <button type="button" style="padding:10px;background:#eee;color:#111;border:0;border-radius:6px">Close</button>';
  const box=panel.querySelector('textarea');
  const rect=e=>{const b=e.getBoundingClientRect();return {x:Math.round(b.x),width:Math.round(b.width)}};
  box.value=JSON.stringify({build:'mobile-no-zoom-1',screen:[screen.width,screen.height],window:[innerWidth,innerHeight],documentWidth:document.documentElement.scrollWidth,visual:visualViewport?{width:visualViewport.width,scale:visualViewport.scale,left:visualViewport.offsetLeft}:null,body:rect(document.body),hero:document.querySelector('.homehero')?rect(document.querySelector('.homehero')):null,cssZoom:getComputedStyle(document.body).zoom,phone:matchMedia('(max-width:600px)').matches,browser:navigator.userAgent},null,2);
  const buttons=panel.querySelectorAll('button');
  buttons[0].onclick=async()=>{try{await navigator.clipboard.writeText(box.value);buttons[0].textContent='Copied';}catch{box.focus();box.select();buttons[0].textContent='Select and copy the text above';}};
  buttons[1].onclick=()=>panel.remove();
  document.body.append(panel);
});

</script>
