<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NFL Last Man Standing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#132650; --navy-2:#1b3266; --navy-3:#24427f; --line:#3a5a9c; --deep:#10204a;
  --red:#e8102e; --red-2:#ff4d5e; --gold:#ffc733; --green:#2fd97e; --grey:#aebbdc; --white:#ffffff;
  --field:#0f5c2e;
  --font-head:'Oswald', 'Arial Narrow', Impact, sans-serif; --font-body:'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--navy);color:var(--white);font-family:var(--font-body);font-size:14px;min-height:100%}
body{background:
  radial-gradient(1200px 500px at 50% -200px, #2f5cb8 0%, transparent 70%),
  repeating-linear-gradient(90deg, transparent 0 79px, rgba(255,255,255,.035) 79px 80px),
  var(--navy)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--gold)}
h1,h2,h3,h4{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.03em;margin:0}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1a3068 0%,#132650 100%);border-bottom:3px solid var(--red);box-shadow:0 6px 24px rgba(0,0,0,.45)}
.hdr-top{display:flex;align-items:center;gap:18px;padding:12px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand .shield{width:46px;height:52px;background:linear-gradient(180deg,var(--red),#8a0000);clip-path:polygon(0 0,100% 0,100% 65%,50% 100%,0 65%);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.brand h1{font-size:30px;font-weight:700;line-height:1}
.brand h1 small{display:block;font-size:12px;letter-spacing:.35em;color:var(--gold);font-weight:500}
.hdr-stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.stat{background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:6px 14px;min-width:96px;text-align:center}
.stat .v{font-family:var(--font-head);font-size:24px;font-weight:700;line-height:1.05}
.stat .l{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey)}
.stat.pub{cursor:pointer;border-color:var(--gold);background:rgba(255,199,51,.12)}
.stat.pub .v{color:var(--gold);font-size:16px;padding-top:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,199,51,.5)}50%{box-shadow:0 0 0 6px rgba(255,199,51,0)}}
.stat.pub.dirty{animation:pulse 1.6s infinite}
.stat.pot .v{color:var(--gold)}
.stat.alive .v{color:var(--green)}
nav{display:flex;gap:2px;padding:0 22px;overflow-x:auto;background:var(--deep)}
nav button{background:transparent;border:0;color:var(--grey);padding:12px 18px;font-family:var(--font-head);font-size:15px;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
nav button:hover{color:#fff}
nav button.active{color:#fff;border-bottom-color:var(--gold)}

main{max-width:1320px;margin:0 auto;padding:22px}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.card h2{font-size:20px;color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card h2 .tag{margin-left:auto;font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.grid{display:grid;gap:18px}
.grid.two{grid-template-columns:1fr 1fr}
.grid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.grid.two,.grid.three{grid-template-columns:1fr}}

.btn{background:var(--navy-3);color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{background:#2f54a0;border-color:#5b7fd0}
.btn.primary{background:var(--red);border-color:var(--red)}
.btn.primary:hover{background:var(--red-2)}
.btn.gold{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:#ff8a8a;border-color:#5a2020}
.btn.danger:hover{background:#3a1010}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=email],input[type=number],select,textarea{background:var(--deep);border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.muted{color:var(--grey)}
.small{font-size:12px}

table{width:100%;border-collapse:collapse}
th{font-family:var(--font-head);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--grey);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid #2c4680;vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.04)}
.num{text-align:right;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.alive{background:rgba(31,191,106,.15);color:var(--green);border:1px solid rgba(31,191,106,.4)}
.pill.out{background:rgba(213,10,10,.15);color:#ff7b7b;border:1px solid rgba(213,10,10,.4)}
.pill.win{background:rgba(255,184,28,.18);color:var(--gold);border:1px solid rgba(255,184,28,.5)}
.pill.paid{background:rgba(31,191,106,.15);color:var(--green)}
.pill.unpaid{background:rgba(255,184,28,.15);color:var(--gold)}
.pill.pending{background:rgba(139,155,184,.15);color:var(--grey)}

.logo{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.logo.lg{width:44px;height:44px}
.logo.xl{width:64px;height:64px}
.team{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.fallback{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--font-head);font-weight:700;font-size:11px;color:#fff;width:28px;height:28px}

/* week selector */
.weeks{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.weeks button{background:var(--deep);border:1px solid var(--line);color:var(--grey);border-radius:6px;padding:6px 0;width:44px;font-family:var(--font-head);font-size:14px;cursor:pointer}
.weeks button.active{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.weeks button.settled{border-color:var(--green);color:var(--green)}
.weeks button.settled.active{color:#1a1200}
.weeks button.live{border-color:var(--red)}
.weeks button.outside{opacity:.35}

/* pick picker */
.overlay{position:fixed;inset:0;background:rgba(3,7,18,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;width:min(1000px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.modal h2{font-size:22px;margin-bottom:6px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.tcard{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:center;position:relative;transition:.12s}
.tcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.tcard .nm{font-family:var(--font-head);font-size:15px;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.tcard .opp{font-size:11px;color:var(--grey);margin-top:2px}
.tcard.used,.tcard.bye,.tcard.final{opacity:.35;cursor:not-allowed;filter:grayscale(1)}
.tcard.used:hover,.tcard.bye:hover,.tcard.final:hover{transform:none;border-color:var(--line)}
.tcard .badge{position:absolute;top:6px;right:6px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--red);color:#fff;font-weight:700}
.tcard.bye .badge{background:#4a6096}
.tcard.selected{border-color:var(--green);box-shadow:0 0 0 2px rgba(31,191,106,.5)}

/* pick table cells */
.pickcell{display:flex;align-items:center;gap:10px}
.pickbtn{display:inline-flex;align-items:center;gap:8px;background:var(--deep);border:1px dashed var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;color:#fff;min-width:170px;text-align:left}
.pickbtn:hover{border-color:var(--gold)}
.pickbtn.has{border-style:solid}
.res{font-family:var(--font-head);font-weight:700;font-size:16px;width:26px;text-align:center}
.res.W{color:var(--green)}.res.L{color:#ff6b6b}.res.T{color:var(--gold)}.res.P{color:var(--grey)}

/* history grid */
.histwrap{overflow:auto}
.hist td,.hist th{padding:5px 6px;text-align:center}
.hist td:first-child,.hist th:first-child{text-align:left;position:sticky;left:0;background:var(--navy-2);z-index:2}
.hcell{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;background:var(--deep)}
.hcell.W{box-shadow:inset 0 0 0 2px var(--green)}
.hcell.L{box-shadow:inset 0 0 0 2px var(--red)}
.hcell.T{box-shadow:inset 0 0 0 2px var(--gold)}
.hcell.NP{color:var(--grey);font-size:11px}
.hcell.wipe{box-shadow:inset 0 0 0 2px #6d5cff}
tr.out td{opacity:.55}

/* results */
.game{display:grid;grid-template-columns:1fr 60px 30px 60px 1fr auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #2c4680}
.game .t{display:flex;align-items:center;gap:10px}
.game .t.home{justify-content:flex-end;text-align:right}
.game input{width:60px;text-align:center;font-family:var(--font-head);font-size:20px;padding:4px}
.game .vs{text-align:center;color:var(--grey);font-family:var(--font-head)}
.game .meta{font-size:11px;color:var(--grey)}
.game.final{background:rgba(31,191,106,.05)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}

/* dashboard */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.bigpot{background:linear-gradient(135deg,#2a4a94,#1b3266);border:1px solid var(--line);border-radius:14px;padding:22px;position:relative;overflow:hidden}
.bigpot:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.04) 22px 24px);pointer-events:none}
.bigpot .amt{font-family:var(--font-head);font-size:64px;font-weight:700;color:var(--gold);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.bigpot .lbl{letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--grey)}
.avatars{display:flex;flex-wrap:wrap;gap:6px}
.av{display:inline-flex;align-items:center;gap:6px;background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px}
.av.out{opacity:.4;text-decoration:line-through}
.feed li{list-style:none;padding:8px 0;border-bottom:1px solid #2c4680;display:flex;gap:10px;align-items:center}
.feed{margin:0;padding:0}
.empty{padding:26px;text-align:center;color:var(--grey);border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;bottom:22px;right:22px;background:#24427f;border:1px solid var(--gold);color:#fff;padding:12px 16px;border-radius:10px;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.6);max-width:360px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--grey);cursor:pointer}
.drop.over{border-color:var(--gold);color:#fff}
.banner{background:linear-gradient(90deg,var(--red),#7a0000);padding:14px 18px;border-radius:12px;margin-bottom:18px;display:flex;align-items:center;gap:14px;font-family:var(--font-head);font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.banner.gold{background:linear-gradient(90deg,var(--gold),#b87d00);color:#1a1200}
.banner .btn{margin-left:auto;font-family:var(--font-body);text-transform:none;letter-spacing:0}
footer{text-align:center;color:var(--grey);font-size:11px;padding:20px}

/* home */
.homehero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,#2b4f9e 0%,#1b3266 55%,#22184a 100%);padding:34px 30px;margin-bottom:18px;box-shadow:0 14px 50px rgba(0,0,0,.35)}
.homehero:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 30px,rgba(255,255,255,.05) 30px 32px);pointer-events:none}
.homehero .kick{letter-spacing:.35em;text-transform:uppercase;font-size:12px;color:var(--gold);font-weight:600}
.homehero h1.big{font-size:64px;line-height:.95;font-weight:700;margin:6px 0 10px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.homehero h1.big span{color:var(--gold)}
.homehero p{max-width:640px;font-size:15px;color:#e6ecff;margin:0 0 18px}
.herostats{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.herostat{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 18px;min-width:140px}
.herostat .v{font-family:var(--font-head);font-size:34px;font-weight:700;line-height:1}
.herostat .l{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin-top:4px}
.herostat.gold .v{color:var(--gold)}.herostat.green .v{color:var(--green)}
.logowall{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.logowall .lw{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;transition:.15s}
.logowall .lw:hover{transform:translateY(-3px);border-color:var(--gold)}
.logowall .lw .ab{font-family:var(--font-head);font-size:12px;letter-spacing:.1em;color:var(--grey);margin-top:6px}
.logowall .fallback{width:52px;height:52px;font-size:15px}
.heroflag{position:absolute;right:-40px;top:-40px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,199,51,.25),transparent 70%);pointer-events:none}
.rules{margin:0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #2c4680;line-height:1.45}
.rules li:before{content:counter(r);flex:none;width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;font-family:var(--font-head);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.rules li b{color:var(--gold)}
.datebox{display:flex;gap:10px;flex-wrap:wrap}
.date{flex:1;min-width:150px;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.date .d{font-family:var(--font-head);font-size:20px;font-weight:600}
.date .l{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--grey)}
.robar{background:linear-gradient(90deg,#24427f,#1b3266);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--grey);display:flex;gap:10px;align-items:center;margin-bottom:14px}
body.ro .edit{display:none!important}
body.ro .pickbtn{border-style:solid;cursor:default;pointer-events:none}
body.ro nav button[data-v=entries],body.ro nav button[data-v=settings]{display:none}
/* Remote additions reuse the original palette and components. */
.rules{font-size:80%}
.rules li:before{font-size:12.8px}
.brand .nfl-logo{width:46px;height:52px;object-fit:contain;flex:none}
input[type=password]{background:var(--deep);border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 10px}
body.player nav{display:flex}
main{max-width:1650px}
body.player main{max-width:1125px}
body.player .teamgrid button{color:var(--white);font:inherit}
body.player .season{display:flex;flex-wrap:wrap;gap:10px}
.personal-link{overflow-wrap:anywhere;min-width:180px}
.personal-link.unpaid-link{opacity:.55}
@media(max-width:900px){body.player .hdr-top{padding:12px;gap:12px}body.player .brand h1{font-size:25px}body.player .hdr-stats{margin-left:0;gap:6px}body.player .stat{min-width:76px;padding:6px 8px}body.player main{padding:14px}body.player .card{padding:16px}body.player .teamgrid{grid-template-columns:repeat(2,minmax(0,1fr))}body.player .card h2{flex-wrap:wrap}}

.nav-icon{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fixture-card{display:grid;grid-template-columns:minmax(0,1fr) 68px;align-items:center;gap:6px;min-height:54px;height:100%;padding:8px;border:1px solid #1b2a4a;border-radius:8px;background:rgba(8,22,52,.18);font-size:11px}
.fixture-matchup{display:flex;align-items:center;gap:4px;min-width:0}
.fixture-matchup .logo{width:21px;height:21px;flex:none}
.fixture-name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.fixture-at{color:var(--grey);flex:none}
.fixture-time{width:68px;justify-self:end;text-align:right;white-space:nowrap;line-height:1.3;font-variant-numeric:tabular-nums;color:var(--grey)}

@media(min-width:601px){
  nav{gap:8px;padding:8px 22px}
  nav button{margin:0;padding:9px 18px;border:1px solid rgba(58,90,156,.65);border-radius:8px;background:rgba(36,66,127,.32);transition:background .15s,border-color .15s,color .15s,transform .15s}
  nav button:hover{background:var(--navy-3);border-color:#5b7fd0;transform:translateY(-1px)}
  nav button.active{background:var(--navy-3);border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold),0 4px 14px rgba(0,0,0,.22)}
}

/* Compact branding and hero, with layouts sized for each viewport. */
.brand{gap:10px;min-width:0}
.brand h1{font-size:25px}
.brand h1 small{font-size:10px;letter-spacing:.25em;margin-top:3px}
.brand .nfl-logo{width:36px;height:42px}
.hdr-top{gap:14px;padding:10px 22px}
.hdr-stats{gap:7px;min-width:0}
.stat{min-width:76px;padding:6px 10px}
.stat .v{font-size:20px}
.stat .l{font-size:9px;letter-spacing:.12em}
.homehero{padding:22px 24px}
.homehero::before{content:none}
.homehero .kick{font-size:10px;letter-spacing:.22em}
.homehero h1.big{font-size:44px;line-height:1.08;margin:8px 0 12px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.homehero p{font-size:14px;line-height:1.5;max-width:680px;margin-bottom:14px}
.herostats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:660px;gap:10px;margin-top:0}
.herostat{min-width:0;padding:10px 12px}
.herostat .v{font-size:26px;overflow-wrap:anywhere}
.herostat .l{font-size:9px;letter-spacing:.12em}
.hero-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:900px){
  body .hdr-top{padding:12px 16px;display:block}
  body .brand h1,body.player .brand h1{font-size:24px}
  body .hdr-stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:12px 0 0;gap:6px}
  body.player .hdr-stats{grid-template-columns:repeat(6,minmax(0,1fr))}
  body .stat,body.player .stat{min-width:0;padding:6px 4px}
  nav{padding:0 12px}
  nav button{padding:12px 14px;font-size:13px;min-height:44px}
  main{padding:18px}
  .homehero h1.big{font-size:38px}
  .card h2{flex-wrap:wrap}
  .card h2 .tag{margin-left:0}
}
@media(max-width:600px){
  header{position:static}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  body .hdr-top{padding:10px 12px}
  body .brand h1,body.player .brand h1{font-size:22px}
  .brand h1 small{font-size:9px;letter-spacing:.2em}
  .brand .nfl-logo{width:30px;height:36px}
  body .hdr-stats,body.player .hdr-stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px}
  .stat .v{font-size:18px}
  .stat .l{font-size:8px;letter-spacing:.08em}

  function teamResult(S, abbr, w){
    const g = teamGame(abbr,w);
    if(!g) return {code:'BYE'};
    const r = S.results[g.id];
    if(!r || !r.final) return {code:'P', game:g, live:!!(r&&(r.hs!=null||r.as!=null))};
    const my = g.home===abbr? +r.hs : +r.as, opp = g.home===abbr? +r.as : +r.hs;

const prizePot = (r=currentRound(),comp=computeRound(r)) => L.prizePot(S,r,comp);
const usedTeams = (entryId,r,comp,uptoWeek) => L.usedTeams(S,entryId,r,comp,uptoWeek);
const aliveAtWeek = (comp,w) => L.aliveAtWeek(S,comp,w);
const isAliveForWeek = (comp,w,id) => L.isAliveForWeek(S,comp,w,id);

/* ===================== UI HELPERS ===================== */
function badge(abbr, cls='logo'){
  const t=TEAMS[abbr]; const size=cls.includes('xl')?64:cls.includes('lg')?44:28; const fs=Math.round(size*0.36);
  return `<span class="fallback" title="${esc(t.name)}" style="background:#${t.color||'333'};box-shadow:inset 0 0 0 3px #${t.alt||'fff'}55;width:${size}px;height:${size}px;font-size:${fs}px">${abbr}</span>`;
}
function logoImg(abbr, cls='logo'){
  const t=TEAMS[abbr]; if(!t) return '';
  if(!IMAGES_OK) return badge(abbr,cls);
  return `<img class="${cls}" src="${t.logo}" alt="${esc(t.name)}" title="${esc(t.name)}" onerror="this.outerHTML='<span class=&quot;fallback&quot; style=&quot;background:#${t.color||'333'}&quot;>${abbr}</span>'">`;
}
function teamChip(abbr, cls='logo'){ const t=TEAMS[abbr]; return t? `<span class="team">${logoImg(abbr,cls)}<span>${esc(t.name)}</span></span>` : '<span class="muted">-</span>'; }
function toast(msg, ms=3200){ const el=document.createElement('div'); el.className='toast'; el.innerHTML=msg; document.getElementById('toastRoot').appendChild(el); setTimeout(()=>el.remove(),ms); }
function modal(html){ const root=document.getElementById('modalRoot'); root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function setView(v){ S.ui.view=v; save({uiOnly:true}); render(); if(accountPage==='/admin')window.scrollTo(0,0); }
function setWeek(w){ S.ui.week=w; save({uiOnly:true}); render(); }
function entryName(id){ const e=S.entries.find(x=>x.id===id); return e? (e.label? `${e.name} (${e.label})`: e.name) : '?'; }
function weekBar(r, comp, extraClass=''){
  const cur=S.ui.week;
  let h='<div class="weeks">';
  for(let w=1;w<=WEEKS;w++){
    const inR = w>=r.startWeek && w<=roundEndWeek(r);
    const cls=[w===cur?'active':'', weekSettled(w)?'settled':(weekHasResults(w)?'live':''), inR?'':'outside'].join(' ');
    h+=`<button class="${cls}" onclick="setWeek(${w})" title="Week ${w}">${w}</button>`;
  }
  return h+'</div>';
}

/* ===================== RENDER ===================== */
function render(){
  if(accountPage && ['/login','/signup','/reset-password'].includes(accountPage))return authForm();
  if(S.ui.view==='members' && ADMIN)return renderMembers();
  if(PLAYER_CODE) return renderPlayer();
  const r=currentRound(); const comp=computeRound(r);
  if(!S.ui.week) S.ui.week=defaultWeek();
  if(S.ui.view==='home')S.ui.view='dash';
  if(S.ui.view==='history')S.ui.view='picks';
  if(isRO()&&!['dash','picks','results','standings'].includes(S.ui.view))S.ui.view='dash';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===S.ui.view));
  renderHeader(r,comp);
  const main=document.getElementById('main');
  document.body.classList.toggle('ro', isRO());
  const memberViews={dash:renderDashboard,picks:renderPicksPage,results:renderResults,standings:renderStandings};
  const adminViews={adminhome:renderAdminHome,dash:renderDash,picks:renderPicks,results:renderResults,entries:renderEntries,settings:renderSettings};
  const views=ADMIN?adminViews:memberViews;
  main.innerHTML=accountBar()+(S.ui.view==='dash'?deadlineBanner(defaultWeek()):'')+(views[S.ui.view]||views.dash)(r,comp);
  const foot=document.getElementById('foot'); if(foot) foot.innerHTML = SHARED ? (ADMIN?(HOSTED?'Admin mode. Changes are saved in this browser until you press Publish.':'Admin mode. Changes are saved in this browser; press Download and upload the new index.html to update the shared page.'):'Live standings. Updated by the organiser after each round of games.') : 'Last Man Standing. Data is saved in this browser. Use Settings &rarr; Backup to export a copy.';
  if(REMOTE && foot) foot.textContent=ADMIN?'Admin mode. Changes are saved to the shared competition.':'Live standings. Refreshes every 45 seconds.';
  if(S.ui.view==='entries') wireDrop();
}
function renderHeader(r,comp){
  const pot=prizePot(r,comp);
  const paid=S.entries.filter(e=>entryPaid(e,r,comp)).length;
  document.getElementById('hdrStats').innerHTML=`
    <div class="stat"><div class="v">R${r.n}</div><div class="l">Round</div></div>
    <div class="stat"><div class="v">WK ${S.ui.week||defaultWeek()}</div><div class="l">Selected</div></div>
    <div class="stat"><div class="v">${S.entries.length}</div><div class="l">Entries</div></div>
    <div class="stat alive"><div class="v">${comp.alive.size}</div><div class="l">Still In</div></div>
    <div class="stat pot"><div class="v">${gbp(pot)}</div><div class="l">Prize Pot</div></div>
    <div class="stat"><div class="v">${paid}/${S.entries.length}</div><div class="l">Paid</div></div>
    ${REMOTE?remoteHeader():SHARED?(ADMIN?`<div class="stat pub ${isDirty()?'dirty':''}" onclick="${HOSTED?'publishLive()':'exportLivePage()'}" title="${HOSTED?'Publish the current state so everyone with the link sees it':'Download an updated index.html to upload to your web host'}"><div class="v">${HOSTED?(isDirty()?'⬆ Publish':'✓ Live'):'⬇ Download'}</div><div class="l">${isDirty()?'unpublished changes':'up to date'}</div></div><div class="stat pub" style="border-color:var(--line);background:transparent" onclick="toggleAdmin()"><div class="v" style="color:#fff">Admin</div><div class="l">exit</div></div>`:`<div class="stat pub" style="border-color:var(--line);background:transparent;opacity:.6" onclick="toggleAdmin()" title="Organiser only"><div class="v" style="color:#fff">🔒</div><div class="l">organiser</div></div>`):''}`;
}

  </div>

function renderDashboard(r,comp){return renderHome(r,comp)+renderDash(r,comp);}

/* ---- Competition overview ---- */
function renderDash(r,comp){
  const pot=prizePot(r,comp);
  const w=defaultWeek();
  let banner='';
  if(comp.complete && comp.winnerIds){
    const names=comp.winnerIds.map(entryName).join(', ');
    banner=`<div class="banner gold">🏆 ${comp.winnerIds.length===1?'Winner':'Pot shared by'}: ${esc(names)} &mdash; ${gbp(pot)} ${comp.winnerIds.length>1?`(${gbp(pot/comp.winnerIds.length)} each)`:''}
      ${comp.finalWeek<WEEKS?`<button class="btn edit" onclick="startNewRound(${comp.finalWeek+1})">Start Round ${r.n+1} from Week ${comp.finalWeek+1}</button>`:''}</div>`.replace(/&mdash;/g,'-');
  }
  const lastWipe=comp.events.filter(e=>e.type==='wipeout').slice(-1)[0];
  if(lastWipe && !comp.complete) banner+=`<div class="banner">💥 Rollover in Week ${lastWipe.week}: all ${lastWipe.count} remaining players lost, all teams are available again. Everyone must pay ${gbp(S.settings.fee)} again to return; unpaid players are eliminated.</div>`;
  if(!S.entries.length) banner+=`<div class="banner">No entries yet <button class="btn gold edit" onclick="setView('entries')">Add or import entries</button></div>`;

  const aliveList=S.entries.filter(e=>comp.alive.has(e.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const pendingList=S.entries.filter(e=>!entryPaid(e,r,comp));
  const outList=S.entries.filter(e=>!comp.alive.has(e.id)&&!pendingList.includes(e)).sort((a,b)=>a.name.localeCompare(b.name));
  const missing=aliveList.filter(e=>!S.picks[e.id]?.[w] && !weekSettled(w) && isAliveForWeek(comp,w,e.id));
  const feed=comp.events.slice().reverse().slice(0,25).map(ev=>{
    if(ev.type==='out') return `<li><span class="pill out">OUT</span> <b>Wk ${ev.week}</b> ${esc(entryName(ev.id))} ${ev.pick?logoImg(ev.pick):''} <span class="muted">${esc(ev.reason)}</span></li>`;
    if(ev.type==='wipeout') return `<li><span class="pill pending">ROLLOVER</span> <b>Wk ${ev.week}</b> All ${ev.count} remaining players lost - new entry fee required to return, all teams available again</li>`;
    if(ev.type==='winner') return `<li><span class="pill win">WINNER</span> <b>Wk ${ev.week}</b> ${esc(entryName(ev.ids[0]))} takes the pot</li>`;
    if(ev.type==='split') return `<li><span class="pill win">SPLIT</span> <b>Wk ${ev.week}</b> Season over, pot shared by ${ev.ids.length}</li>`;
  }).join('');
  const games=gamesByWeek(w);
  const pickCounts={}; aliveList.forEach(e=>{const p=visiblePick(e.id,w); if(p&&p!=='HIDDEN') pickCounts[p]=(pickCounts[p]||0)+1;});
  const popular=Object.entries(pickCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);

  return `${banner}
  <div class="hero">
    <div class="bigpot">
      <div class="lbl">Round ${r.n} prize pot</div>
      <div class="amt">${gbp(pot)}</div>
      <div class="muted small">Confirmed entry and rollover fees &middot; ${S.entries.filter(e=>entryPaid(e,r,comp)).length} paid, ${S.entries.filter(e=>!entryPaid(e,r,comp)).length} unpaid</div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary edit" onclick="setWeek(${w});setView('picks')">Make Week ${w} picks</button>
        <button class="btn edit" onclick="setWeek(${w});setView('results')">Enter results</button>
        ${HOSTED?'':`<button class="btn edit" onclick="fetchWeekResults(${w})">⟳ Fetch Week ${w} scores</button>`}
        <button class="btn" onclick="setView('picks')">Picks and history</button>
      </div>
    </div>
    <div class="card" style="margin:0">
      <h2>Week ${w} status <span class="tag">${weekSettled(w)?'Settled':(weekHasResults(w)?'In progress':'Upcoming')}</span></h2>
      <div class="grid two" style="gap:10px">
        <div><div class="muted small">Still in</div><div style="font-family:var(--font-head);font-size:34px;color:var(--green)">${comp.alive.size}</div></div>
        <div><div class="muted small">Picks outstanding</div><div style="font-family:var(--font-head);font-size:34px;color:${missing.length?'var(--gold)':'var(--green)'}">${missing.length}</div></div>
      </div>
      ${missing.length?`<div class="small muted" style="margin-top:8px">Waiting on: ${missing.slice(0,12).map(e=>esc(e.name)).join(', ')}${missing.length>12?` +${missing.length-12} more`:''}</div>`:''}
      <div style="margin-top:12px"><div class="muted small" style="margin-bottom:6px">Most picked this week</div>
        ${popular.length? popular.map(([t,c])=>`<span class="av">${logoImg(t)} ${TEAMS[t].short} <b>${c}</b></span>`).join(' ') : '<span class="muted small">No picks yet</span>'}</div>
    </div>
  </div>
  <div class="grid two" style="margin-top:18px">
    <div class="card" style="margin:0">
      <h2>Still standing <span class="tag">${aliveList.length}</span></h2>
      ${aliveList.length? `<div class="avatars">${aliveList.map(e=>{const vp=visiblePick(e.id,w); const p=vp==='HIDDEN'?null:vp; return `<span class="av">${p?logoImg(p):`<span class="fallback" style="background:#3a4a6a;width:22px;height:22px">${vp?'🔒':'?'}</span>`} ${esc(e.name)}${e.label?` <span class="muted">${esc(e.label)}</span>`:''}</span>`;}).join('')}</div>`:'<div class="empty">No active entries at the moment</div>'}
      ${pendingList.length?`<h2 style="margin-top:18px">Awaiting payment <span class="tag">${pendingList.length}</span></h2><div class="avatars">${pendingList.map(e=>`<span class="av">${esc(e.name)}</span>`).join('')}</div>`:''}
      ${outList.length?`<h2 style="margin-top:18px">Eliminated <span class="tag">${outList.length}</span></h2><div class="avatars">${outList.map(e=>`<span class="av out">${esc(e.name)}</span>`).join('')}</div>`:''}
    </div>
    <div class="card" style="margin:0">
      <h2>Live feed</h2>
      ${feed? `<ul class="feed">${feed}</ul>` : '<div class="empty">Nothing has happened yet. Once results are in, eliminations show here.</div>'}
    </div>
  </div>
  <div class="card" style="margin-top:18px">
    <h2>Week ${w} fixtures <span class="tag">${games.length} games · UK time</span></h2>
    <div class="grid three" style="gap:6px">
    ${games.map(g=>{const r=S.results[g.id]; const fin=r?.final; const hw=fin&&+r.hs>+r.as, aw=fin&&+r.as>+r.hs;
      return `<div class="fixture-card small"><div class="fixture-matchup">
        ${logoImg(g.away)}<span class="fixture-name" style="${aw?'color:var(--green)':''}">${TEAMS[g.away].short}</span>
        <span class="fixture-at">${fin?`${r.as}-${r.hs}`:'@'}</span>
        <span class="fixture-name" style="${hw?'color:var(--green)':''}">${TEAMS[g.home].short}</span>${logoImg(g.home)}
        </div><time class="fixture-time" datetime="${esc(g.date)}">${fin?'FINAL':fmtDate(g.date).replace(', ','<br>')}</time></div>`;}).join('')}
    </div>
  </div>`;
}

function renderStandings(r,comp){
  const w=defaultWeek();
  const aliveList=S.entries.filter(e=>comp.alive.has(e.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const pendingList=S.entries.filter(e=>!entryPaid(e,r,comp)).sort((a,b)=>a.name.localeCompare(b.name));
  const outList=S.entries.filter(e=>!comp.alive.has(e.id)&&!pendingList.includes(e)).sort((a,b)=>a.name.localeCompare(b.name));
  const list=(entries,cls='')=>entries.length?`<div class="avatars">${entries.map(e=>{const vp=visiblePick(e.id,w),p=vp==='HIDDEN'?null:vp;return `<span class="av ${cls}">${p?logoImg(p):''}${esc(e.name)}${e.label?` <span class="muted">${esc(e.label)}</span>`:''}</span>`;}).join('')}</div>`:'<div class="empty">Nobody in this group.</div>';
  return `<div class="card"><h1 style="font-family:var(--font-head);margin-top:0">Standings</h1><p class="muted">Round ${r.n}. Current Week ${w} picks stay hidden until kick-off.</p>
    <h2>Still standing <span class="tag">${aliveList.length}</span></h2>${list(aliveList)}
    ${pendingList.length?`<h2 style="margin-top:22px">Awaiting payment <span class="tag">${pendingList.length}</span></h2>${list(pendingList)}`:''}
    <h2 style="margin-top:22px">Eliminated <span class="tag">${outList.length}</span></h2>${list(outList,'out')}
  </div>`;
}

/* ---- Picks ---- */
function renderPicks(r,comp){
  const w=S.ui.week;
  const inRound = w>=r.startWeek && w<=roundEndWeek(r);
  const eligible=S.entries.filter(e=>isAliveForWeek(comp,w,e.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const others=S.entries.filter(e=>!isAliveForWeek(comp,w,e.id));
  const settled=weekSettled(w);
  const done=eligible.filter(e=>S.picks[e.id]?.[w]).length;
  const rows=eligible.map(e=>{
    const vp=visiblePick(e.id,w); const hidden=vp==='HIDDEN'; const p=hidden?null:vp;
    const res=p?teamResult(p,w):null;
    const g=p?teamGame(p,w):null;
    const opp=g?(g.home===p?`vs ${TEAMS[g.away].short}`:`@ ${TEAMS[g.home].short}`):'';
    const used=usedTeams(e.id,r,comp,w);
    const lost = res && (isPickLost(res.code));
    return `<tr class="${lost?'out':''}">
      <td><b>${esc(e.name)}</b>${e.label?`<div class="muted small">${esc(e.label)}</div>`:''}</td>
      <td><div class="pickcell">
        <button class="pickbtn ${p||hidden?'has':''}" ${isRO()?'':`onclick="openPicker('${e.id}',${w})"`}>${p?`${logoImg(p)}<span>${esc(TEAMS[p].name)}</span>`:hidden?'<span class="muted">🔒 Pick in, hidden until kick-off</span>':`<span class="muted">${isRO()?'No pick yet':'Choose team…'}</span>`}</button>
        ${p?`<button class="btn sm ghost edit" title="Clear pick" onclick="clearPick('${e.id}',${w})">✕</button>`:''}
      </div></td>
      <td class="muted small">${opp}${g?`<div>${fmtDate(g.date)}</div>`:''}</td>
      <td>${res?`<span class="res ${res.code==='BYE'?'L':res.code}">${res.code==='P'?'–':res.code==='BYE'?'BYE':res.code}</span>${res.my!=null?`<span class="muted small"> ${res.my}-${res.opp}</span>`:''}`:''}</td>
      <td class="small">${Object.keys(used).length? Object.keys(used).sort((a,b)=>used[a]-used[b]).map(t=>logoImg(t)).join(' ') : '<span class="muted">none</span>'}</td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <h2>Week ${w} picks <span class="tag">${done}/${eligible.length} picked ${settled?'· week settled':''}</span></h2>
    ${weekBar(r,comp)}
    ${!inRound?`<div class="empty">Week ${w} is outside Round ${r.n} (weeks ${r.startWeek} to ${roundEndWeek(r)}).</div>`:''}
    <div class="row" style="margin-bottom:12px">
      <span class="muted small">${isRO()?'Picks are locked once the first game of the week kicks off.':'Each player can use a team once per round. Greyed-out teams in the picker are already used, on a bye, or the game has finished.'}</span>
      <span style="margin-left:auto"></span>
      <button class="btn sm" onclick="printSheet(${w})">🖨 Print pick sheet</button>
      <button class="btn sm edit" onclick="setView('results')">Go to results →</button>
    </div>
    ${REMOTE && ADMIN?chaseStrip(w,r,comp):''}

}

/* ---- Results ---- */
function renderResults(r,comp){
  const w=S.ui.week; const games=gamesByWeek(w);
  const pickedTeams={}; S.entries.forEach(e=>{const p=S.picks[e.id]?.[w]; if(p) pickedTeams[p]=(pickedTeams[p]||0)+1;});
  const rows=games.map(g=>{
    const res=S.results[g.id]||{};
    const fin=!!res.final;
    const hw=fin&&+res.hs>+res.as, aw=fin&&+res.as>+res.hs;
    const pk=t=>pickedTeams[t]?`<span class="pill pending" title="Picked by ${pickedTeams[t]}">${pickedTeams[t]} pick${pickedTeams[t]>1?'s':''}</span>`:'';
    return `<div class="game ${fin?'final':''}">
      <div class="t">${logoImg(g.away,'logo lg')}<div><div style="${aw?'color:var(--green)':''}"><b>${esc(TEAMS[g.away].name)}</b></div><div class="meta">Away ${pk(g.away)}</div></div></div>

      <div class="vs">@</div>
      ${isRO()?`<div class="vs" style="font-size:22px;color:#fff">${res.hs??'-'}</div>`:`<input type="number" min="0" value="${res.hs??''}" placeholder="0" onchange="setScore('${g.id}','hs',this.value)">`}
      <div class="t home"><div><div style="${hw?'color:var(--green)':''}"><b>${esc(TEAMS[g.home].name)}</b></div><div class="meta">Home ${pk(g.home)}</div></div>${logoImg(g.home,'logo lg')}</div>
      <div style="text-align:right">${isRO()?`<span class="pill ${fin?'alive':'pending'}">${fin?'Final':'Pending'}</span>`:`<label class="chk"><input type="checkbox" ${fin?'checked':''} onchange="setFinal('${g.id}',this.checked)"> Final</label>`}<div class="meta">${fmtDate(g.date)}</div></div>
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>Week ${w} results <span class="tag">${games.filter(g=>S.results[g.id]?.final).length}/${games.length} final</span></h2>
    ${weekBar(r,comp)}
    <div class="row edit" style="margin-bottom:10px">
      ${HOSTED?'':`<button class="btn primary" onclick="fetchWeekResults(${w})">⟳ Fetch live scores from ESPN</button>`}
      <button class="btn" onclick="markAllFinal(${w})">Mark all entered scores final</button>
      <button class="btn danger" onclick="clearWeekResults(${w})">Clear week</button>
      <span class="muted small" style="margin-left:auto">Type scores (away @ home) and tick Final. A week counts as settled once every game is final; eliminations for no-picks and rollover checks happen then.</span>
    </div>
    ${rows}
  </div>`;
}
function setScore(gid,side,val){ const r=S.results[gid]||{hs:null,as:null,final:false}; r[side]=val===''?null:+val; S.results[gid]=r; save(); renderHeader(currentRound(),computeRound(currentRound())); }
function setFinal(gid,on){ const r=S.results[gid]||{hs:null,as:null,final:false}; if(on&&(r.hs==null||r.as==null)){ toast('Enter both scores before marking final.'); render(); return;} r.final=on; S.results[gid]=r; save(); render(); }
function markAllFinal(w){ gamesByWeek(w).forEach(g=>{const r=S.results[g.id]; if(r&&r.hs!=null&&r.as!=null) r.final=true;}); save(); render(); }
function clearWeekResults(w){ if(!confirm(`Clear all Week ${w} scores?`)) return; gamesByWeek(w).forEach(g=>delete S.results[g.id]); save(); render(); }
async function fetchWeekResults(w){
  if(REMOTE) return remoteResults(w);
  toast(`Fetching Week ${w} scores…`,1500);
  try{
    const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${w}&dates=${SCHEDULE.season}`);
    const d=await res.json();
    let n=0, fin=0;
    for(const ev of d.events||[]){
      const c=ev.competitions[0];
      const home=c.competitors.find(x=>x.homeAway==='home'), away=c.competitors.find(x=>x.homeAway==='away');
      const g=GAMES.find(x=>x.id===ev.id) || GAMES.find(x=>x.week===w && x.home===home.team.abbreviation && x.away===away.team.abbreviation);
      if(!g) continue;
      const started=ev.status?.type?.state!=='pre';
      if(!started){ continue; }
      const completed=!!ev.status?.type?.completed;
      S.results[g.id]={hs:+home.score,as:+away.score,final:completed}; n++; if(completed) fin++;
    }
    save(); render();
    toast(n?`Updated ${n} game${n>1?'s':''} (${fin} final).`:`No Week ${w} games have started yet.`);
  }catch(e){ toast('Could not reach ESPN: '+e.message); }
}

/* ---- History ---- */
function renderHistory(r,comp){
  const weeks=[]; for(let w=r.startWeek; w<=(comp.finalWeek||roundEndWeek(r)); w++) weeks.push(w);
  const entries=S.entries.slice().sort((a,b)=>{const aa=comp.alive.has(a.id),bb=comp.alive.has(b.id); return aa===bb? a.name.localeCompare(b.name) : (aa?-1:1);});
  const outWeek={}; comp.events.filter(e=>e.type==='out').forEach(e=>{ outWeek[e.id]=e.week; });
  // if wipeout later re-admitted them, ignore earlier outs
  comp.events.filter(e=>e.type==='wipeout').forEach(e=>{ Object.keys(outWeek).forEach(id=>{ if(outWeek[id]<=e.week) delete outWeek[id]; }); });
  const rows=entries.map(e=>{
    const alive=comp.alive.has(e.id);
    return `<tr class="${alive?'':'out'}"><td><b>${esc(e.name)}</b>${e.label?`<div class="muted small">${esc(e.label)}</div>`:''}</td>
      <td>${comp.complete&&comp.winnerIds?.includes(e.id)?'<span class="pill win">Winner</span>':alive?'<span class="pill alive">In</span>':`<span class="pill out">Out wk ${outWeek[e.id]??'?'}</span>`}</td>
      ${weeks.map(w=>{
        const vp=visiblePick(e.id,w); const p=vp==='HIDDEN'?null:vp;
        const wk=comp.weeks[w];
        const eligible=isAliveForWeek(comp,w,e.id);
        if(!eligible) return `<td><span class="hcell" style="opacity:.15"></span></td>`;
        if(vp==='HIDDEN') return `<td><span class="hcell NP" title="Hidden until kick-off">🔒</span></td>`;
        if(!p) return `<td><span class="hcell NP">${wk?.settled?'NP':'–'}</span></td>`;
        const res=teamResult(p,w);
        const cls=res.code==='BYE'?'L':res.code==='P'?'':res.code;
        return `<td><span class="hcell ${cls} ${wk?.wipeout?'wipe':''}" title="${esc(TEAMS[p].name)} ${res.my!=null?res.my+'-'+res.opp:''}">${logoImg(p)}</span></td>`;
      }).join('')}
    </tr>`;
  }).join('');
  return `<div class="card"><h2>Round ${r.n} pick history <span class="tag">green = win · red = loss · gold = tie · purple = rollover week</span></h2>
    <div class="row" style="margin-bottom:10px"><button class="btn sm edit" onclick="exportPicksCSV()">⬇ Export picks CSV</button>
    ${S.rounds.length>1?`<span class="muted small" style="margin-left:auto">Previous rounds: ${S.rounds.slice(0,-1).map(x=>`R${x.n} (wk ${x.startWeek}-${x.endWeek}) won by ${(x.winnerIds||[]).map(entryName).join(', ')}`).join(' · ')}</span>`:''}</div>
    ${entries.length?`<div class="histwrap"><table class="hist"><thead><tr><th>Player</th><th>Status</th>${weeks.map(w=>`<th>W${w}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No entries yet.</div>'}
  </div>`;
}
function exportPicksCSV(){
  const r=currentRound();
  const weeks=[]; for(let w=r.startWeek; w<=roundEndWeek(r); w++) weeks.push(w);
  const lines=[['Name','Entry','Email','Paid',...weeks.map(w=>'Week '+w)].join(',')];
  S.entries.forEach(e=>lines.push([e.name,e.label||'',e.email||'',entryPaid(e)?'Yes':'No',...weeks.map(w=>S.picks[e.id]?.[w]?TEAMS[S.picks[e.id][w]].name:'')].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')));
  download(`lms-round${r.n}-picks.csv`, lines.join('\n'), 'text/csv');
}
async function download(name, content, type){
  if(HOSTED){
    const dl = await window.claude.use('downloads');
    if(!dl) return toast('Downloads are not available in this view.');
    try{ await dl.save({filename:name, data: content instanceof Blob||content instanceof ArrayBuffer ? content : new Blob([content],{type})}); }catch(e){ if(e?.code!=='cancelled'&&e?.code!=='rejected') toast('Download failed: '+(e?.message||e)); }
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function addEntry(name,label='',email='',paid=false){ name=(name||'').trim(); if(!name) return false; S.entries.push({id:uid(),name,label:(label||'').trim(),email:(email||'').trim(),paid:!!paid,created:Date.now()}); return true; }
function addEntryFromForm(){ const n=document.getElementById('newName').value; if(!n.trim()) return toast('Enter a name'); addEntry(n,document.getElementById('newLabel').value,document.getElementById('newEmail').value,document.getElementById('newPaid').value==='1'); save(); render(); toast(`Added ${esc(n)}`); }
function setEntryPayment(id,paid){const e=S.entries.find(x=>x.id===id);if(!e)return;const r=currentRound(),comp=computeRound(r),week=L.paymentWeek(r,comp);if(week===r.startWeek)e.paid=paid;else (e.rolloverPayments ||= {})[week]=paid;save();render();}
function updEntry(id,k,v){ const e=S.entries.find(x=>x.id===id); if(e){ e[k]=v; save(); render(); } }
function delEntry(id){ const e=S.entries.find(x=>x.id===id); if(!confirm(`Remove ${e.name}${e.label?' ('+e.label+')':''}? Their picks will be deleted too.`)) return; S.entries=S.entries.filter(x=>x.id!==id); delete S.picks[id]; save(); render(); }
function clearEntries(){ if(!confirm('Remove ALL entries and their picks?')) return; S.entries=[]; S.picks={}; save(); render(); }
function importPaste(){
  const txt=document.getElementById('pasteBox').value; let n=0;
  txt.split(/\r?\n/).forEach(line=>{ if(!line.trim()) return; const parts=line.split(/[,\t;]/).map(s=>s.trim()); if(addEntry(parts[0],parts[1],parts[2],/^(y|yes|paid|true|1)$/i.test(parts[3]||''))) n++; });
  save(); render(); toast(`Added ${n} entr${n===1?'y':'ies'}`);
}
function truthy(v){ return /^(y|yes|paid|true|1|✓|x)$/i.test(String(v??'').trim()); }
function wireDrop(){
  const drop=document.getElementById('drop'), inp=document.getElementById('fileInput'); if(!drop) return;
  drop.onclick=()=>inp.click();
  inp.onchange=()=>{ if(inp.files[0]) importFile(inp.files[0]); };
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over'); if(e.dataTransfer.files[0]) importFile(e.dataTransfer.files[0]);};
}
function importFile(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
      if(!rows.length) return toast('That file looks empty.');
      previewImport(rows,file.name);
    }catch(e){ toast('Could not read file: '+e.message); }
  };
  reader.readAsArrayBuffer(file);
}
function previewImport(rows,fname){
  const hdr=rows[0].map(h=>String(h).toLowerCase().trim());
  const find=(...keys)=>hdr.findIndex(h=>keys.some(k=>h===k||h.includes(k)));
  let iName=find('name','player','entrant'), iLabel=find('label','entry','team name','team'), iEmail=find('email','e-mail'), iPaid=find('paid','payment','fee');
  const hasHeader = iName>=0 || iEmail>=0 || iPaid>=0 || iLabel>=0;
  if(!hasHeader){ iName=0; iLabel=1; iEmail=2; iPaid=3; }
  const data=(hasHeader?rows.slice(1):rows).map(r=>({name:String(r[iName]??'').trim(),label:iLabel>=0?String(r[iLabel]??'').trim():'',email:iEmail>=0?String(r[iEmail]??'').trim():'',paid:iPaid>=0?truthy(r[iPaid]):false})).filter(x=>x.name);
  if(!data.length) return toast('No names found. Make sure there is a Name column.');
  window._importData=data;
  modal(`<h2>Import ${data.length} entries <span class="muted small" style="font-family:var(--font-body);text-transform:none;letter-spacing:0">from ${esc(fname)}</span></h2>
    <div class="muted small">Columns detected: ${hasHeader?`Name → "${esc(rows[0][iName])}"${iLabel>=0?`, Label → "${esc(rows[0][iLabel])}"`:''}${iEmail>=0?`, Email → "${esc(rows[0][iEmail])}"`:''}${iPaid>=0?`, Paid → "${esc(rows[0][iPaid])}"`:''}`:'no header row found, treating column A as names'}</div>

}

async function apiRequest(path,body,key=remoteKey){
  const headers={'x-lms-request':'1'};
  if(body!==undefined)headers['Content-Type']='application/json';
  const response=await fetch(path,{method:body===undefined?'GET':'POST',headers,cache:'no-store',...(body===undefined?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(20000)});
  const data=await response.json();
  if(data.serverTime){serverEpoch=new Date(data.serverTime).getTime();serverMonotonic=performance.now();}
  if(!response.ok)throw Object.assign(new Error(data.message||'Could not complete that request.'),{code:data.error,status:response.status});

}
function applyRemote(data,sequence=remoteSequence){
  remoteRevision=data.revision||remoteRevision;
  if(sequence===remoteSequence){const ui=S.ui;S=hydrate(data);S.ui=ui;}
  else {
    // Keep edits made while a previous save was travelling to the server.
    S.entries.forEach(e=>{const saved=data.entries.find(x=>x.id===e.id);if(saved)e.code=saved.code;});
    if(!remoteReplacePicks)S.picks=data.picks;
    S.updatedAt=data.updatedAt;
  }
  ADMIN=data.admin===true;
}
function queueRemote(work){
  remoteWrites++;liveStatus='Saving…';updateLiveStatus();
  const job=remoteQueue.then(work);
  remoteQueue=job.catch(()=>{});
  return job.then(data=>{remoteLastError=null;return data;}).catch(error=>{
    remoteLastError=error;toast(esc(error.message));throw error;
  }).finally(()=>{remoteWrites--;liveStatus=remoteLastError?'Save failed':remoteDirty||remoteWrites?'Saving…':'✓ Live';updateLiveStatus();});
}
function flushRemote(){
  clearTimeout(remoteTimer);
  if(!REMOTE||!ADMIN)return Promise.resolve();
  return queueRemote(async()=>{
    if(!remoteDirty)return;
    const sequence=remoteSequence;
    const body={settings:S.settings,entries:S.entries,results:S.results,rounds:S.rounds,baseRevision:remoteRevision,...(remoteReplacePicks?{replacePicks:S.picks}:{})};
    const data=await apiRequest('/api/admin/state',body);
    if(sequence===remoteSequence){remoteDirty=false;remoteReplacePicks=false;}
    applyRemote(data,sequence);
    // Do not destroy a partly typed entry/import form when autosave completes.
    if(!document.querySelector('#main input:focus,#main textarea:focus,#main select:focus'))render();
    else refreshPersonalLinks();
  });
}

}

    const game=teamGame(t.abbr,w),bye=!game,isUsed=used[t.abbr]!=null,started=game&&(new Date(game.date).getTime()<=serverNow()||S.results[game.id]?.final),disabled=bye||isUsed||started||playerSending;
    const reason=isUsed?`Used wk ${used[t.abbr]}`:bye?'Bye':started?'Locked':'';
    return `<button type="button" class="tcard ${isUsed?'used':bye?'bye':started?'final':''} ${playerSelected===t.abbr?'selected':''}" ${disabled?'disabled':''} aria-label="Pick ${esc(t.name)}${reason?' - '+reason:''}" aria-pressed="${playerSelected===t.abbr}" onclick="selectPlayerTeam('${t.abbr}')">${reason?`<span class="badge">${reason}</span>`:''}${logoImg(t.abbr,'logo xl')}<div class="nm">${esc(t.short)}</div><div class="opp">${game?`${game.home===t.abbr?'vs '+TEAMS[game.away].short:'@ '+TEAMS[game.home].short} · ${fmtDay(game.date)}`:'BYE WEEK'}</div></button>`;
  }).join('')}</div>${playerSelected?`<div class="row" style="margin-top:14px"><button id="confirmPlayerPick" class="btn primary" onclick="submitPlayerPick(playerSelected)" ${playerSending?'disabled':''}>${playerSending?'Saving…':'Confirm '+esc(TEAMS[playerSelected].name)}</button><button class="btn" onclick="playerSelected=null;renderPlayer()" ${playerSending?'disabled':''}>Cancel</button></div>`:''}${p?`<button class="btn ghost sm" style="margin-top:14px" onclick="submitPlayerPick(null)" ${playerSending?'disabled':''}>Clear pick</button>`:''}</div>`;
  return html+renderHistory(r,comp);
}
function renderPlayer(){
  document.body.classList.add('player','ro');document.getElementById('nav').classList.remove('hidden');
  const main=document.getElementById('main');document.getElementById('foot').textContent='Your account. All deadlines and kick-off times are UK time.';
  if(!playerMe){document.getElementById('nav').classList.add('hidden');document.getElementById('hdrStats').innerHTML='';main.innerHTML=`<div class="card"><h2>Your competition</h2><p>${esc(playerError||'Loading your personal link…')}</p><a href="/">Dashboard</a></div>`;return;}
  const e=playerMe.entry,r=currentRound(),comp=computeRound(r),first=defaultWeek(),end=roundEndWeek(r);
  if(!S.ui.week||S.ui.week<first||S.ui.week>end)S.ui.week=first;
  if(S.ui.view==='home')S.ui.view='dash';if(S.ui.view==='history')S.ui.view='picks';if(!['dash','picks','results','standings'].includes(S.ui.view))S.ui.view='dash';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===S.ui.view));
  renderHeader(r,comp);
  const usedAll=usedTeams(e.id,r,comp,null);
  const accountSummary=`<div class="card"><h2>Hi ${esc(e.name)} ${playerStatus(comp,e)}</h2><p class="pill ${entryPaid(e,r,comp)?'alive':'pending'}">${entryPaid(e,r,comp)?'Active (paid)':'Inactive (not paid)'} · Round ${r.n}${comp.resetWeek>r.startWeek?' · Rollover':''}</p>${e.label?`<p class="muted">${esc(e.label)}</p>`:''}<p>Current pot <b style="color:var(--gold)">${gbp(prizePot(r,comp))}</b></p><div class="small muted">Already used since the last reset</div><div class="avatars" style="margin-top:8px">${Object.keys(usedAll).map(t=>logoImg(t)).join('')||'<span class="muted small">No teams used yet.</span>'}</div></div>`;
  const pages={dash:()=>memberTools()+deadlineBanner(first)+accountSummary+renderDashboard(r,comp),picks:()=>renderMemberPicks(e,r,comp),results:()=>renderResults(r,comp),standings:()=>renderStandings(r,comp)};
  main.innerHTML=pages[S.ui.view]();updateCountdown();
}
function updateCountdown(){const el=document.getElementById('playerCountdown');if(!el||!playerMe)return;const w=S.ui.week,p=playerMe.picks[w],time=L.weekDeadline(w);let minutes=Math.max(0,Math.ceil((time-serverNow())/60000));el.textContent=minutes?`Locks in ${Math.floor(minutes/1440)}d ${Math.floor(minutes%1440/60)}h ${minutes%60}m`:'Pick deadline has passed.';}
function selectPlayerTeam(team){playerSelected=team;renderPlayer();document.getElementById('confirmPlayerPick')?.scrollIntoView({behavior:'smooth',block:'center'});}
async function submitPlayerPick(team){
  if(playerSending)return;remoteSequence++;playerSending=true;renderPlayer();
  try{acceptMe(await apiRequest('/api/pick',{entryId:PLAYER_CODE,week:S.ui.week,team},''));playerSelected=null;playerChanging=false;toast(team?'Your pick is confirmed.':'Your pick has been cleared.');}
  catch(error){toast(esc(error.message));try{acceptMe(await apiRequest('/api/me?entryId='+encodeURIComponent(PLAYER_CODE),undefined,''));}catch{}}
  finally{playerSending=false;renderPlayer();}
}
let lastPlayerBoundary=null;
setInterval(()=>{if(!PLAYER_CODE||!playerMe)return;const boundary=String(playerLock(S.ui.week))+':'+gamesByWeek(S.ui.week).filter(g=>new Date(g.date).getTime()<=serverNow()).length;if(boundary!==lastPlayerBoundary){lastPlayerBoundary=boundary;renderPlayer();}else updateCountdown();},1000);

/* ===================== INIT ===================== */
document.getElementById('nav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.v); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
/* ACCOUNT:START */
let accountUser=null,accountEntries=[],accountPage=['/login','/signup','/dashboard','/admin','/reset-password'].includes(location.pathname)?location.pathname:null;
const accountCall=(action,body)=>apiRequest('/api/account?action='+action,body);
function accountBar(){if(location.protocol==='file:')return '';if(accountPage==='/admin')return adminNavigation();return ['/login','/signup','/reset-password'].includes(accountPage)?'<div class="row account-bar"><a class="btn" href="/">Dashboard</a></div>':'';}
const adminSections=[['adminhome','Admin home'],['entries','Entries & payments'],['members','Members & roles'],['picks','Manage picks'],['results','Results'],['settings','Settings'],['dash','Overview']];
function adminNavigation(){return accountPage==='/admin'&&ADMIN?`<div class="admin-nav" role="navigation" aria-label="Admin tools">${adminSections.map(([view,label])=>`<button class="btn ${S.ui.view===view?'gold':''}" aria-current="${S.ui.view===view?'page':'false'}" onclick="setView('${view}')">${view==='members'&&accountUser?.role!=='owner'?'Members':label}</button>`).join('')}</div>`:'';}
function renderAdminHome(r,comp){
 const paid=S.entries.filter(e=>entryPaid(e,r,comp)).length;
 const tools=[['entries','Entries & payments','Mark fees as paid, add people manually and import entries.'],['members',accountUser?.role==='owner'?'Members & roles':'Members',accountUser?.role==='owner'?'Assign admins, manage access, link entries and reset passwords.':'View members and reset member passwords.'],['picks','Manage picks','Add or change picks for any member, including corrections after the deadline.'],['results','Results','Fetch scores, enter results and settle the week.'],['settings','Competition settings','Manage rounds, rules, entry fees and backups.'],['dash','Competition overview','Check the prize pot, standings, missing picks and fixtures.']];
 return `<div class="card admin-intro"><div class="kick">${accountUser?.role==='owner'?'Owner':'Administrator'} access</div><h1>Admin area</h1><p>Manage your competition here. Your own entry and picks are in <a href="/dashboard">My dashboard</a>.</p><div class="row"><span class="pill">Round ${r.n}</span><span class="pill paid">${paid} paid</span><span class="pill unpaid">${S.entries.length-paid} awaiting payment</span></div></div><div class="admin-tools">${tools.map(([view,label,description])=>`<button class="card admin-tool" onclick="setView('${view}')"><strong>${label}</strong><span>${description}</span><span class="admin-tool-open">Open →</span></button>`).join('')}</div>${deadlineBanner(defaultWeek())}`;
}

function deadlineBanner(w){const d=L.weekDeadline(w);return `<div class="card deadline"><b>Week ${w} pick deadline: ${d?new Date(d).toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}):'Awaiting fixtures'} (UK time)</b><div class="small muted">All picks and changes close one hour before the first kick-off.${d&&d<=serverNow()?' This week is now locked.':''}</div></div>`;}
function remoteHeader(){
 if(!accountUser)return '<a class="stat pub" style="color:inherit;font:inherit;text-decoration:none" href="/login"><div class="v" style="font-size:18px">Sign in</div><div class="l">join / login</div></a>';
 const staff=['owner','admin'].includes(accountUser.role),inAdmin=accountPage==='/admin';
 return `<a class="stat pub" style="color:inherit;font:inherit;text-decoration:none" href="${staff?(inAdmin?'/dashboard':'/admin'):'/dashboard'}"><div class="v" style="font-size:18px">${staff?(inAdmin?'Exit admin':'Admin'):'Account'}</div><div class="l">${staff?(inAdmin?'dashboard':accountUser.role):'dashboard'}</div></a><button type="button" class="stat pub" style="color:inherit;font:inherit" onclick="accountLogout()"><div class="v" style="font-size:18px">Sign out</div><div class="l">account</div></button>`;
}
async function remoteAdmin(){location.href=accountUser&&['admin','owner'].includes(accountUser.role)?'/admin':'/login';}
async function accountLogout(){try{await flushRemote();await remoteQueue;if(remoteDirty)return;await accountCall('logout',{});location.href='/';}catch(e){toast(esc(e.message));}}
function authForm(){
 const signup=accountPage==='/signup',reset=accountPage==='/reset-password';
 document.body.classList.add('ro');document.getElementById('nav').classList.add('hidden');document.getElementById('hdrStats').innerHTML='';document.getElementById('foot').textContent='Manual payments. Play responsibly. 18+.';
 document.getElementById('main').innerHTML=accountBar()+`<div class="card auth-card"><h2>${reset?'Set a new password':signup?'Join Last Man Standing':'Welcome back'}</h2><p class="muted">${reset?'Your reset link works once and expires after one hour.':signup?'Create your account and you’re in. No confirmation email. The organiser will activate your entry once you have paid.':'Sign in to manage your weekly picks.'}</p><form id="accountForm">${reset?'':`${signup?'<label>Your name <span class="muted">(optional)</span><input type="text" name="name" autocomplete="name" maxlength="100"></label>':''}<label>Email address<input name="email" type="email" autocomplete="email" required maxlength="320" ${signup&&location.hash.startsWith('#setup=')?'value="roboshea@gmail.com"':''}></label>`}<label>Password<input name="password" type="password" autocomplete="${signup||reset?'new-password':'current-password'}" ${signup||reset?'minlength="7"':''} maxlength="256" required></label>${signup||reset?'<p class="small muted">At least 7 characters.</p>':''}<p id="accountError" role="alert"></p><button class="btn gold" type="submit">${reset?'Save password':signup?'Create account':'Sign in'}</button></form><p>${reset?'<a href="/login">Back to sign in</a>':signup?'Already registered? <a href="/login">Sign in</a>':'New here? <a href="/signup">Create an account</a>'}</p>${!signup&&!reset?'<details><summary>Forgotten your password?</summary><p>Contact the organiser for a private password reset link.</p></details>':''}</div>`;
 document.getElementById('accountForm').onsubmit=async event=>{
  event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),error=document.getElementById('accountError');button.disabled=true;error.textContent='';
  try{const body=Object.fromEntries(new FormData(form));if(signup)body.setupToken=new URLSearchParams(location.hash.slice(1)).get('setup');if(reset)body.token=new URLSearchParams(location.hash.slice(1)).get('token');await accountCall(reset?'reset':signup?'signup':'login',body);history.replaceState(null,'',location.pathname);location.href=reset?'/login':'/dashboard';}catch(e){error.textContent=e.message;button.disabled=false;}
 };
}
async function accountBoot(){
 const data=await accountCall('me');accountUser=data.user;accountEntries=data.entries;
 if(['/login','/signup','/reset-password'].includes(accountPage)){authForm();return true;}
 if(accountPage==='/dashboard'||location.pathname.startsWith('/play/')){
  if(!accountUser){location.replace('/login');return true;}
  if(!accountEntries.length){document.getElementById('main').innerHTML=accountBar()+'<div class="card"><h2>Your entries</h2><p>You have no entries yet.</p><button class="btn gold" onclick="addAccountEntry()">Add an entry</button></div>';return true;}
  PLAYER_CODE=accountEntries.find(e=>e.id===new URLSearchParams(location.search).get('entry'))?.id||accountEntries[0].id;
 }
 if(accountPage==='/admin'&&(!accountUser||!['owner','admin'].includes(accountUser.role))){location.replace('/login');return true;}
 return false;
}
function memberEntrySwitcher(){return accountEntries.length>1?`<label>Entry <select onchange="location.href='/dashboard?entry='+encodeURIComponent(this.value)">${accountEntries.map(e=>`<option value="${esc(e.id)}" ${e.id===PLAYER_CODE?'selected':''}>${esc(e.name+(e.label?' - '+e.label:''))}</option>`).join('')}</select></label>`:'';}
function memberTools(){return `<div class="card"><h2>My account <span class="tag">${esc(accountUser?.email||'')}</span></h2><div class="row">${memberEntrySwitcher()}<button class="btn" onclick="addAccountEntry()">Add another entry</button><button class="btn" onclick="changeAccountPassword()">Change password</button></div></div>`;}
async function addAccountEntry(){try{const data=await accountCall('entry',{});location.href='/dashboard?entry='+encodeURIComponent(data.entryId);}catch(e){toast(esc(e.message));}}
function changeAccountPassword(){
 modal('<h2>Change password</h2>'+ `<form id="passwordForm"><label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>New password<input name="password" type="password" autocomplete="new-password" minlength="7" maxlength="256" required></label><p class="small muted">At least 7 characters.</p><p id="passwordError" role="alert"></p><button class="btn gold">Save password</button></form>`);
 document.getElementById('passwordForm').onsubmit=async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.disabled=true;try{await accountCall('password',Object.fromEntries(new FormData(e.currentTarget)));closeModal();toast('Password updated. Other sessions have been signed out.');}catch(error){document.getElementById('passwordError').textContent=error.message;btn.disabled=false;}};
}
async function renderMembers(){
 try{const data=await accountCall('members');
 const owner=accountUser.role==='owner';
 const ownerPanels=owner?`<div class="card"><h2>Connect entries to accounts</h2>${data.entries.length?data.entries.map(e=>`<div class="row" style="margin-bottom:12px"><b>${esc(e.name)} ${esc(e.label||'')}</b><select aria-label="Account for ${esc(e.name)}" onchange="assignEntry('${e.id}',this.value)"><option value="">${e.accountId?'Choose account':'Managed manually'}</option>${data.users.filter(u=>!u.disabled).map(u=>`<option value="${u.id}" ${e.accountId===u.id?'selected':''}>${esc(u.email)}</option>`).join('')}</select></div>`).join(''):'<p>No entries yet.</p>'}</div><div class="card"><h2>Recent admin activity</h2>${data.audit.map(a=>`<p class="small">${esc(new Date(a.created_at).toLocaleString('en-GB',{timeZone:'Europe/London'}))} · ${esc(data.users.find(u=>u.id===a.actor_id)?.name||'System')} · ${esc(a.action)}${a.target_id?' · '+esc(data.entries.find(e=>e.id===a.target_id)?.name||data.users.find(u=>u.id===a.target_id)?.email||'Entry'):''}</p>`).join('')||'<p>No activity yet.</p>'}</div>`:'';
 document.getElementById('main').innerHTML=accountBar()+`<div class="card"><h2>${owner?'Members and roles':'Members'}</h2><p class="muted">${owner?'Use Entries to add people manually and mark payments. Link an entry below only after checking who it belongs to. Members sign up without email confirmation.':'Use Entries & payments to add people and mark fees as paid. Members sign up without email confirmation.'}</p><div class="tablewrap"><table><thead><tr><th>Member</th><th>Role</th><th>Access</th><th>Actions</th></tr></thead><tbody>${data.users.map(u=>`<tr><td>${esc(u.name)}<br><span class="small muted">${esc(u.email)}</span></td><td>${owner&&u.role!=='owner'?`<select aria-label="Role for ${esc(u.name)}" onchange="memberAction('role','${u.id}',{role:this.value})"><option ${u.role==='member'?'selected':''}>member</option><option ${u.role==='admin'?'selected':''}>admin</option></select>`:esc(u.role)}</td><td>${u.disabled?'Disabled':'Enabled'}</td><td>${u.role!=='owner'&&(owner||u.role==='member')?`<button class="btn sm" onclick="memberAction('reset-link','${u.id}')">Reset password</button>`:''}${owner&&u.role!=='owner'?` <button class="btn sm" onclick="memberAction('disable','${u.id}',{disabled:${!u.disabled}})">${u.disabled?'Enable':'Disable'}</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>${ownerPanels}`;
 }catch(e){toast(esc(e.message));}
}
async function memberAction(action,userId,extra={}){try{const data=await accountCall(action,{userId,...extra});if(data.resetToken){modal('<h2>Private password reset link</h2>'+ `<p>Send this link privately to the member. It expires in one hour and works once.</p><input id="resetLink" readonly value="${esc(location.origin+'/reset-password#token='+data.resetToken)}"><button class="btn" onclick="copyText(document.getElementById('resetLink').value)">Copy link</button>`);}else await renderMembers();}catch(e){toast(esc(e.message));}}
async function assignEntry(entryId,userId){if(!userId)return;try{await accountCall('assign',{entryId,userId});applyRemote(await apiRequest('/api/state'));toast('Entry connected.');}catch(e){toast(esc(e.message));}await renderMembers();}
/* ACCOUNT:END */
bootRemote().then(()=>{
  if(new URLSearchParams(location.search).get('display-check')!=='1')return;
  const panel=document.createElement('section');
  panel.setAttribute('aria-label','Display check');
  panel.style.cssText='position:fixed;z-index:9999;left:8px;right:8px;bottom:8px;max-width:440px;margin:auto;background:#fff;color:#111;padding:16px;border:2px solid #ffc733;border-radius:12px;font:16px/1.4 system-ui;box-shadow:0 4px 30px #0008';
  panel.innerHTML='<b>Display check</b><p style="margin:8px 0">Copy these details and paste them into our chat.</p><textarea readonly aria-label="Display details" style="display:block;width:100%;height:110px;font:16px/1.3 monospace;color:#111;background:#f1f3f6;padding:8px;border:1px solid #777"></textarea><button type="button" style="margin-top:10px;padding:10px;background:#132650;color:white;border:0;border-radius:6px">Copy display details</button> <button type="button" style="padding:10px;background:#eee;color:#111;border:0;border-radius:6px">Close</button>';
  const box=panel.querySelector('textarea');
  const rect=e=>{const b=e.getBoundingClientRect();return {x:Math.round(b.x),width:Math.round(b.width)}};
  box.value=JSON.stringify({build:'mobile-no-zoom-1',screen:[screen.width,screen.height],window:[innerWidth,innerHeight],documentWidth:document.documentElement.scrollWidth,visual:visualViewport?{width:visualViewport.width,scale:visualViewport.scale,left:visualViewport.offsetLeft}:null,body:rect(document.body),hero:document.querySelector('.homehero')?rect(document.querySelector('.homehero')):null,cssZoom:getComputedStyle(document.body).zoom,phone:matchMedia('(max-width:600px)').matches,browser:navigator.userAgent},null,2);
  const buttons=panel.querySelectorAll('button');
  buttons[0].onclick=async()=>{try{await navigator.clipboard.writeText(box.value);buttons[0].textContent='Copied';}catch{box.focus();box.select();buttons[0].textContent='Select and copy the text above';}};
  buttons[1].onclick=()=>panel.remove();
  document.body.append(panel);
});
